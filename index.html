{
 id:12, unit:"Physics", title:"Magnetic Effects of Electric Current", icon:"🧲",
 notes:[
  ["§12.1 Magnetic field and field lines",["A compass needle is a small bar magnet; its north-seeking end is the north pole.","A magnetic field has both direction and magnitude. Field lines go from the north pole to the south pole outside the magnet, and from south to north inside — they are closed curves.","Where field lines are crowded, the field is stronger.","No two field lines cross; if they did, a compass at that point would point in two directions."]],
  ["§12.2 Field due to a current",["Hans Christian Oersted (1820) found that a current in a wire deflects a nearby compass needle.","Straight conductor: field lines are concentric circles around the wire. The field increases with current and decreases with distance from the wire.","Right-hand thumb rule: hold the wire in the right hand with the thumb along the current; the curled fingers give the direction of the field (also called Maxwell's corkscrew rule).","Circular loop: field lines become nearly straight near the centre. With n turns, the field is n times stronger.","Solenoid: a coil of many circular turns of insulated copper wire. Its field resembles a bar magnet's; inside, the field lines are parallel straight lines — the field is uniform.","Electromagnet: a soft iron core placed inside a solenoid becomes strongly magnetised when current flows."]],
  ["§12.3 Force on a current-carrying conductor",["André-Marie Ampère suggested that a magnet exerts an equal and opposite force on a current-carrying conductor.","Reversing the current reverses the direction of the force (displacement of the rod).","The force is largest when the current is perpendicular to the magnetic field.","Fleming's left-hand rule: stretch the thumb, forefinger and middle finger mutually perpendicular. Forefinger = field, middle finger = current, thumb = force (motion).","In medicine: nerve impulses in the heart and brain create weak magnetic fields. Magnetic Resonance Imaging (MRI) uses magnetic fields inside the body to image body parts."]],
  ["§12.4 Domestic electric circuits",["Supply: AC at 220 V and 50 Hz.","Live wire — red insulation (positive). Neutral — black insulation (negative). Earth wire — green insulation, connected to a metal plate deep in the earth near the house.","Earthing: metallic bodies of appliances (iron, toaster, fridge) are connected to the earth wire, giving a low-resistance path for leaking current so the user doesn't get a severe shock.","Two separate circuits: 15 A for high-power appliances (geysers, air coolers) and 5 A for bulbs and fans. Appliances are connected in parallel.","Short-circuiting: live and neutral wires touch directly (damaged insulation or a fault); the current increases abruptly.","Overloading: short-circuiting, an accidental rise in supply voltage, or connecting too many appliances to one socket.","The electric fuse (Joule heating melts it) is the most important safety device against short-circuiting and overloading."]]
 ],
 cards:[["Right-hand thumb rule","Thumb along the current; curled fingers give the magnetic field direction."],["Fleming's left-hand rule","Forefinger = field, middle finger = current, thumb = force."],["Field inside a solenoid","Uniform – parallel straight lines."],["Electromagnet","Soft iron core inside a current-carrying solenoid."],["Wire colours","Live – red; neutral – black; earth – green."],["Domestic supply in India","AC, 220 V, 50 Hz"],["Short circuit","Live and neutral touch directly; current increases abruptly."],["Why earthing?","Gives leaking current a low-resistance path to earth, preventing severe shocks."]],
 mcq:[
  ["Which correctly describes the magnetic field near a long straight wire?",["Straight lines perpendicular to the wire","Straight lines parallel to the wire","Radial lines originating from the wire","Concentric circles centred on the wire"],3,"Direction is given by the right-hand thumb rule.","NCERT Ex. 1"],
  ["At the time of a short circuit, the current in the circuit:",["Reduces substantially","Does not change","Increases heavily","Varies continuously"],2,"Resistance becomes very small.","NCERT Ex. 2"],
  ["True or false: a wire with green insulation is usually the live wire.",["False — green is the earth wire","True","True only in AC circuits","False — green is the neutral wire"],0,"Live is red; neutral is black; earth is green.","NCERT Ex. 3(b)"],
  ["The force on a current-carrying conductor in a magnetic field is largest when:",["The current is perpendicular to the field","The current is parallel to the field","The current is at 45° to the field","There is no current"],0,"There is no force when current is parallel to the field.","NCERT Ex. 5"],
  ["An electron beam moving horizontally from the back wall to the front wall is deflected to your right. The magnetic field is:",["Vertically downwards","Vertically upwards","Towards the front wall","Towards the back wall"],0,"Current is opposite to electron flow; applying Fleming's left-hand rule gives a downward field.","NCERT Ex. 6"],
  ["The rule for the direction of the magnetic field around a straight current-carrying conductor is the:",["Right-hand thumb rule","Fleming's left-hand rule","Snell's law","Ohm's law"],0,"Fleming's left-hand rule gives the direction of the force instead.","NCERT Ex. 7"],
  ["The magnetic field inside a long straight current-carrying solenoid:",["Is the same at all points","Is zero","Decreases towards its end","Increases towards its end"],0,"The field inside is uniform.","Book §12.2.4"],
  ["The frequency of AC supplied to homes in India is:",["50 Hz","60 Hz","220 Hz","100 Hz"],0,"The potential difference is 220 V.","Book §12.4"],
  ["Which is the most important safety device against short-circuiting and overloading?",["Electric fuse","Earth wire","Switch","Voltmeter"],0,"Joule heating melts the fuse and breaks the circuit.","Book §12.4"],
  ["Magnetic field lines never cross each other because:",["A compass would point in two directions at that point","They are always parallel","They start and end at the same pole","The field is zero there"],0,"The field has only one direction at a point.","Book §12.1"]

 id:13, unit:"Biology", title:"Our Environment", icon:"🌍",
 notes:[
  ["§13.1 Ecosystem — components",["An ecosystem is made of biotic (living) and abiotic (physical: temperature, rainfall, wind, soil, minerals) components interacting with each other.","Natural ecosystems: forests, ponds, lakes. Artificial (human-made): gardens, crop fields, aquariums.","Producers: green plants (and some bacteria) that make food from inorganic substances using sunlight.","Consumers: herbivores, carnivores, omnivores and parasites.","Decomposers: bacteria and fungi break down dead remains into simple substances that return to the soil."]],
  ["§13.1.1 Food chains and webs",["Food chain: e.g. grass → deer → lion. Each step is a trophic level. Autotrophs are the first trophic level; herbivores are the second.","Only about 10% of the food eaten (organic matter/energy) reaches the next level of consumers; the rest is lost as heat, digestion and work. So food chains usually have only 3 or 4 steps.","There are generally more individuals at lower trophic levels; producers are the most numerous.","Flow of energy is unidirectional: energy captured by autotrophs doesn't go back to the sun, and energy passed to herbivores doesn't come back to autotrophs.","Food web: food chains are interconnected as branching lines, since one organism may be eaten by many others.","Biological magnification: pesticides and other non-biodegradable chemicals accumulate at each trophic level. Humans at the top have the highest concentration. Even food grains, vegetables, fruits and meat contain pesticide residues."]],
  ["§13.2.1 Ozone layer",["Ozone (O₃) at the higher levels of the atmosphere shields Earth from the sun's ultraviolet (UV) radiation. At ground level, ozone is a deadly poison.","Formation: UV splits O₂ into free oxygen atoms (O₂ → O + O), which combine with O₂: O + O₂ → O₃.","Ozone dropped sharply in the 1980s, linked to chlorofluorocarbons (CFCs) used as refrigerants and in fire extinguishers.","In 1987, UNEP forged an agreement to freeze CFC production at 1986 levels. It is now mandatory for manufacturers to make CFC-free refrigerators."]],
  ["§13.2.2 Managing garbage",["Biodegradable substances are broken down by biological processes (e.g. by bacteria and saprophytes): peels, paper, cotton, wood.","Non-biodegradable substances are not broken down this way: plastics, glass, some chemicals. They persist and harm ecosystems.","Practices: reduce, reuse, recycle; segregate waste; compost biodegradable waste; use cloth bags, switch off unnecessary lights and fans, walk instead of driving."]]
 ],

[1,"2024","Name the type of reaction when calcium oxide reacts with water, with the equation.","Combination reaction (also exothermic): CaO(s) + H₂O(l) → Ca(OH)₂(aq) + heat."],
[1,"2026","What happens when (a) an iron nail is dipped in CuSO₄ solution (b) KI is mixed with lead nitrate (c) AgCl is kept in sunlight?","(a) Fe + CuSO₄ → FeSO₄ + Cu – blue solution turns light green (displacement). (b) Pb(NO₃)₂ + 2KI → PbI₂↓ (yellow) + 2KNO₃ (double displacement). (c) 2AgCl → 2Ag + Cl₂ – turns grey (photolytic decomposition)."],

[2,"2023","How does baking soda differ from baking powder?","Baking soda is NaHCO₃ only. Baking powder is baking soda + a mild edible acid such as tartaric acid (neutralises the sodium carbonate formed, so there's no bitter taste)."],
[2,"2026","How is tooth decay related to pH? How can it be prevented?","Tooth decay starts when mouth pH falls below 5.5 – bacteria make acids from leftover food, which corrode enamel. Prevent it by cleaning the mouth after eating and using toothpastes, which are basic and neutralise the acid."],
[2,"2026","Why does a bee sting hurt, and why does baking soda help?","A bee sting leaves an acid that causes pain and irritation. Baking soda is a mild base – it neutralises the acid."],
[2,"2026","Explain the chlor-alkali process. Name the products at the anode and cathode.","Electrolysis of brine: 2NaCl(aq) + 2H₂O(l) → 2NaOH(aq) + Cl₂(g) + H₂(g). Chlorine at the anode, hydrogen at the cathode, sodium hydroxide near the cathode."],
[3,"2026","Why are carbonate and sulphide ores converted to oxides before extraction?","It is easier to obtain a metal from its oxide than from its carbonate or sulphide – the oxide is reduced with carbon."],
[3,"2026","Write a reaction in which aluminium is used as a reducing agent.","Thermit reaction: Fe₂O₃ + 2Al → 2Fe + Al₂O₃ + heat (also 3MnO₂ + 4Al → 3Mn + 2Al₂O₃ + heat)."],
[3,"2026","Why can't highly reactive metals be obtained from their oxides using carbon? Why is solder used for welding electrical wires?","These metals have more affinity for oxygen than carbon has, so they're obtained by electrolytic reduction. Solder (lead + tin) has a low melting point."],
[4,"2026","Ethanol + X (with conc. H₂SO₄) gives sweet-smelling Y. Y + NaOH gives back ethanol and Z. Identify X, Y, Z and the role of conc. H₂SO₄.","X = ethanoic acid, Y = ester (ethyl ethanoate), Z = sodium ethanoate. Conc. H₂SO₄ is the acid catalyst. Reactions: esterification, then saponification."],
[4,"2026","Give reasons: (I) covalent compounds are poor conductors (II) soap doesn't lather in hard water.","(I) No ions are formed – bonds are made by sharing electrons. (II) Calcium and magnesium salts in hard water react with soap to form an insoluble precipitate (scum)."],
[5,"2023","Show with a flow chart how glucose is broken down to release energy, with and without oxygen.","Glucose → pyruvate + energy (cytoplasm). With oxygen (mitochondria): pyruvate → CO₂ + H₂O + energy. Lack of oxygen in muscles: pyruvate → lactic acid + energy. In yeast: pyruvate → ethanol + CO₂ + energy."],
[5,"2023","Where are nephrons found? Give their structure and function.","In the kidneys. Each nephron has a cup-shaped Bowman's capsule around a cluster of thin-walled capillaries, leading into a coiled tubule. It filters blood, selectively reabsorbs useful substances (glucose, amino acids, salts, water) and forms urine."],
[5,"2026","Why is bile important for digestion even though it has no enzymes? Name substances reabsorbed in the nephron tubules.","Bile makes the acidic food from the stomach alkaline so pancreatic enzymes can act, and its salts break fats into small globules (emulsification). Reabsorbed: glucose, amino acids, salts and water."],
[6,"2023","What is the role of insulin? Which disease results from its deficiency? How are its timing and amount regulated?","Insulin from the pancreas regulates blood sugar. Deficiency causes diabetes. A feedback mechanism controls it: when blood sugar rises, pancreas cells detect it and release more insulin; as sugar falls, secretion drops."],
[6,"2024","Name the hormone that regulates carbohydrate, protein and fat metabolism, and its gland. Why is iodised salt important?","Thyroxin, from the thyroid gland. Iodine is needed to make thyroxin; lack of it can cause goitre (swollen neck)."],
[6,"2025","How is the brain protected? A patient can't maintain posture and balance – which part is affected?","The brain is in a bony box (skull), inside a fluid-filled balloon that absorbs shocks. Posture and balance: the cerebellum, in the hind-brain."],
[6,"2026","A squirrel faces danger ('fight or flight'). What immediate changes occur in its body?","Adrenaline is released into the blood: the heart beats faster to supply more oxygen to muscles, blood to the digestive system and skin is reduced and diverted to skeletal muscles, and the breathing rate increases."],
[6,"2024","How is the movement of a sensitive plant's leaves different from the downward movement of roots?","Sensitive plant: quick response to touch, no growth – cells change shape by losing water. Roots: slow growth movement towards gravity (geotropism)."],
[7,"2026","What happens when (i) Bryophyllum leaves fall on wet soil (ii) a copper-T is placed in the uterus (iii) Spirogyra breaks into fragments?","(i) Buds on the leaf margins grow into new plants (vegetative propagation). (ii) It prevents pregnancy (IUCD contraception). (iii) Each fragment grows into a new filament (fragmentation)."],
[8,"2026","A couple has 4 daughters and no son. Does this mean the husband doesn't make Y-bearing sperms? What is the chance of another daughter?","No. Half his sperms carry X and half carry Y; which one fertilises the egg is a matter of chance. Each child has a 50% chance of being a girl (XX × XY → XX, XY, XX, XY)."],
[8,"2025","Explain 'proteins control the expression of characters' using tallness in plants.","A gene makes an enzyme that produces a growth hormone. If the enzyme works efficiently, more hormone is made and the plant is tall. If the gene is altered, the enzyme is less efficient, less hormone is made and the plant is short."],
[8,"2022","Violet-flowered × white-flowered pea plants. Describe F₁ and F₂. If 100 F₂ plants form, how many show the recessive trait?","F₁: all violet (violet is dominant). F₂ (by self-pollination): violet : white = 3 : 1, so about 25 of 100 plants are white."],
[9,"2026","A convex lens of focal length 20 cm; object at 40 cm. Find the position and nature of the image.","Object is at 2F, so the image is at 2F on the other side: v = +40 cm. Real, inverted and the same size."],
[9,"2026","A convex lens (f = 30 cm) and a concave lens (f = 15 cm) are in contact. Find the equivalent power and focal length.","P = 1/0.30 − 1/0.15 = 3.33 − 6.67 = −3.33 D. f = 1/P = −0.30 m = −30 cm, so it acts as a concave (diverging) lens."],
[9,"2026","A mirror always forms a virtual, erect and diminished image. Name it.","A convex mirror – e.g. rear-view mirrors in vehicles."],
[10,"2025","Give reasons: (i) the sky looks dark to passengers at very high altitude (ii) danger signals are red. Why is a rainbow seen only after rain?","(i) Scattering isn't prominent at such heights. (ii) Red is least scattered by fog or smoke, so it is seen from far away. A rainbow needs water droplets in the air: they act like small prisms – refraction, dispersion, internal reflection, refraction again. It is seen with the sun behind you."],
[10,"2023","The power of the eye to see both near and far diminishes with age. Why? Name the defect and its correction.","With age the ciliary muscles weaken and the eye lens loses flexibility, so accommodation decreases – presbyopia. Corrected with bi-focal lenses (concave on top for distance, convex below for near)."],
[10,"2026","What is the Tyndall effect? What happens when sunlight is scattered by very large particles?","Scattering of light by colloidal particles makes the beam's path visible (e.g. sunbeams in a forest). Very large particles scatter all colours and the light appears white."],
[11,"2024","Show how to connect three 6 Ω resistors to get 9 Ω.","Put two of them in parallel (1/R = 1/6 + 1/6 → 3 Ω), then connect this in series with the third: 3 + 6 = 9 Ω."],

// confetti (canvas, respects reduced motion)
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#confetti'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#7B1E2B','#22358F','#F6E7A1','#C2410C','#23804F','#2B4ACB'];
  const P=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:Math.random()*7+4,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6,vr:(Math.random()-.5)*.3}));
  let f=0;(function tick(){ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});
    if(++f<150)requestAnimationFrame(tick);else ctx.clearRect(0,0,cv.width,cv.height);})();
}

// ---------- answer checking for typed flashcards ----------
const STOP=new Set('the a an of to in is are and or it its by for with on at as from that this be which into so than then more less very can also each one eg etc has have was were their them they these those not no but all only when while about up out use used using called known does do if we us our you your there what how why who will would should may might same other such any some most many much per like both just two three four five between where'.split(' '));
const SUBS={'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9','⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-','ₙ':'n','·':' '};
const normTxt=s=>String(s).replace(/Ω/g,' ohm ').toLowerCase().replace(/[₀-₉⁰-⁹⁻ₙ·]/g,ch=>SUBS[ch]||ch).replace(/[–—→]/g,' ');
const words=s=>normTxt(s).split(/[^a-z0-9]+/).filter(Boolean);
const stem=w=>w.length>4?w.replace(/(ies)$/,'y').replace(/(ing|ed|es|s)$/,''):w;
const compact=s=>normTxt(s).replace(/[^a-z0-9]/g,'');
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length];}
function keyWords(front,back){
  const fw=new Set(words(front).map(stem));
  const all=[...new Set(words(back).filter(w=>(w.length>=2||/\d/.test(w))&&!STOP.has(w)).map(stem))];
  const k=all.filter(w=>!fw.has(w));
  return k.length?k:all;
}
const ANT=[['gain','loss'],['acid','base'],['acidic','basic'],['red','blue'],['concave','convex'],['excess','limited'],['sulphide','carbonate'],['binary','multiple'],['dominant','recessive'],['sheet','wire'],['increase','decrease'],['series','parallel'],['north','south'],['real','virtual'],['erect','inverted'],['myopia','hypermetropia'],['aerobic','anaerobic'],['oxidised','reduced'],['oxidation','reduction'],['anode','cathode'],['positive','negative'],['towards','away'],['more','less'],['higher','lower'],['high','low'],['sour','bitter'],['two','many'],['self','cross'],['upward','downward'],['contract','relax'],['thick','thin'],['inside','outside'],['saturated','unsaturated'],['single','triple'],['male','female'],['xx','xy'],['sensory','motor'],['voluntary','involuntary'],['biodegradable','non'],['artery','vein'],['xylem','phloem'],['tall','short'],['ethanol','lactic'],['in','out'],['one','both']];
const ANTI={};ANT.forEach(([a,b])=>{ANTI[stem(a)]=stem(b);ANTI[stem(b)]=stem(a);});
const seq=s=>words(s).filter(w=>!STOP.has(w)||ANTI[stem(w)]).map(stem);
function contradicts(back,typed){
  const b=seq(back), t=seq(typed), bset=new Set(b);
  for(let i=0;i<t.length;i++){const a=ANTI[t[i]]; if(!a)continue;
    if(!bset.has(t[i])&&bset.has(a))return true;                       // uses the opposite word only
    const nx=t[i+1]; if(nx&&b.some((w,j)=>w===a&&b[j+1]===nx)&&!b.some((w,j)=>w===t[i]&&b[j+1]===nx))return true; // swapped pairing, e.g. "loss of oxygen"
  }
  return false;
}
function checkAnswer(front,back,typed){
  const t=typed.trim(); if(!t)return {ok:false,hit:0,need:1};
  // formula / short answer: compact text of the first clause typed exactly
  const ct=compact(t), sent1=back.split(/;|\. | – |\.$/)[0], bare=sent1.replace(/\([^)]*\)/g,' ');
  const first=compact(bare.split(/: (?=[A-Za-z])/)[0]);
  if(first.length>=2&&first.length<=24&&!compact(front).includes(first)&&ct.includes(first)&&ct.length<=first.length*2+6)return {ok:true,hit:1,need:1};
  if([...back.matchAll(/\(([^)]*)\)/g)].some(m=>{const x=compact(m[1]);return x.length>=2&&x.length<=24&&x===ct;}))return {ok:true,hit:1,need:1};
  const numericOnly=!/[a-z]{3,}/.test(normTxt(bare))&&compact(bare).length>0;
  if(numericOnly)return ct.includes(compact(bare))?{ok:true,hit:1,need:1}:{ok:false,hit:0,need:1};
  if(contradicts(back,t))return {ok:false,hit:0,need:1,contra:true};
  const K=keyWords(front,back), sw=words(t).map(stem);
  const has=k=>sw.some(w=>w===k||(k.length>=5&&w.length>=4&&lev(w,k)<=1)||(k.length>=6&&w.length>=5&&lev(w,k)<=2)||(k.length>=6&&w.length>=5&&(k.startsWith(w)||w.startsWith(k))));
  const hit=K.filter(has).length;
  const need=Math.max(1,K.length<=2?K.length:Math.min(Math.ceil(K.length*0.4),4));
  return {ok:hit>=need,hit,need};
}

      if(!ta.value.trim()){draw({ok:false,msg:'Type your answer in the box first.'});return;}
      const r=checkAnswer(card[0],card[1],ta.value);
      if(r.ok){
        let msg='Correct!';
        if(!known&&!S.revealed[key]){S.known[c.id]=[...new Set([...(S.known[c.id]||[]),idx])];save();addPoints(2,'',true);msg='Correct! +2 points.';}
        else if(!known){S.known[c.id]=[...new Set([...(S.known[c.id]||[]),idx])];save();markStudied();msg='Correct! (No points – you turned this card over earlier.)';}
        else{markStudied();msg='Correct! (Points already earned for this card.)';}
        state.open=idx; draw({ok:true,msg});
      } else draw({ok:false,msg:r.contra?'Not quite – part of your answer says the opposite. Try again, or tap the card to see the answer (no points).':(r.need<=1?'Not quite – check your answer and try again, or tap the card to see the answer (no points).':`Not quite – you have ${r.hit} of the ${r.need} key points needed. Try again, or tap the card to see the answer (no points).`)});
    };
  };
  state.deck=state.deck.filter(i=>state.practice||!(S.known[c.id]||[]).includes(i));
  draw();
}
const QUIZ_N=15;
function Quiz(c){
  const qf=state.qf||'all';
  const pool=c.mcq.filter((q,i)=>qf==='all'||(qf==='board'?i>=c.nBook:i<c.nBook));
  if(!state.qs){state.qs=shuffle(pool).slice(0,qf==='all'?QUIZ_N:pool.length).map(q=>prepQ(q,c.id));state.qi=0;state.score=0;state.picked=null;state.combo=0;state.pts=0;}
  const nB=c.mcq.length-c.nBook;
  const chips=`<div class="filters">${[['all','All questions'],['book','NCERT book'],['board','Board papers']].map(([k,l])=>`<button class="${k===qf?'on':''}" onclick="go('chapter',{id:${c.id},tab:'quiz',qf:'${k}'})">${l}</button>`).join('')}</div>`;
  const draw=()=>{
    const {qs,qi}=state;
    if(qi>=qs.length){
      const p=Math.round(state.score/qs.length*100);
      if(qf==='all'){const prev=S.bestPct[c.id]; if(prev==null||p>prev){S.bestPct[c.id]=p;save();} if(p===100){S.perfect++;save();}}
      if(p===100)confetti();
      checkBadges();
      $('#pane').innerHTML=chips+`<div class="card result"><div class="big">${state.score}/${qs.length}</div><p style="font-size:20px;margin:12px 0 4px;font-weight:700">${p===100?'Perfect score. Board-ready!':p>=80?'Excellent work.':p>=60?'Good – review the ones you missed.':'Keep going – reread the notes and try again.'}</p><p class="muted" style="margin:0">${qf==='all'?'Best score: '+S.bestPct[c.id]+'%. Try again for a new set of questions.':'Only All questions quizzes count towards your best score.'}</p><span class="xpgain">+${state.pts} points earned</span><div class="row" style="justify-content:center;margin-top:18px"><button class="btn" onclick="go('chapter',{id:${c.id},tab:'notes'})">Reread notes</button><button class="btn primary" onclick="go('chapter',{id:${c.id},tab:'quiz',qf:'${qf}'})">Try again</button></div></div>`;
      return;
    }
    const q=qs[qi], p=state.picked;
    $('#pane').innerHTML=chips+`<div class="card q-box">
      <div class="q-meta"><span>Question ${qi+1} of ${qs.length} · Score ${state.score}</span>${state.combo>=3?`<span class="combo">🔥 ${state.combo} in a row</span>`:''}</div>
      <div class="bar"><i style="width:${qi/qs.length*100}%"></i></div>
      <span class="src ${q.src.startsWith('Board')?'board':''}">${esc(q.src)}</span><div class="q-text">${esc(q.q)}</div>
      ${q.opts.map((o,i)=>`<button class="opt ${p!=null?(i===q.ans?'right':i===p?'wrong':''):''}" data-i="${i}" ${p!=null?'disabled':''}><span class="k">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}
      ${p!=null?`<div class="explain"><b class="${p===q.ans?'ok':'no'}">${p===q.ans?(state.lastNew?'Correct! +5 points.':'Correct! (You already earned points for this question.)'):'Not quite.'}</b> ${esc(q.why)}</div><div class="row" style="justify-content:flex-end"><button class="btn primary" id="nx">${qi+1<qs.length?'Next question':'See result'}</button></div>`:''}
    </div>`;
    document.querySelectorAll('.q-box .opt').forEach(b=>b.onclick=()=>{state.picked=+b.dataset.i;S.answered++;
      if(state.picked===q.ans){state.score++;state.combo++;const key=c.id+'|'+q.q;state.lastNew=!S.qGot[key];if(state.lastNew){S.qGot[key]=1;state.pts+=5;addPoints(5,'',true);}else markStudied();if(state.combo===5||state.combo===10)toast(`🔥 ${state.combo} in a row!`);}else{state.combo=0;save();checkBadges();}
      draw();$('#nx').focus();});
    if(p!=null)$('#nx').onclick=()=>{state.qi++;state.picked=null;draw();};
  };
  draw();
}

// ---------- mock test ----------
const MOCK_PER_CH=2, MOCK_MIN=30, MOCK_BOARD_N=25, PASS=0.33;
function Mock(){
  const phase=state.phase||'intro';
  if(phase==='intro'){
    const mode=state.mode||'mixed';
    const n=mode==='mixed'?CHAPTERS.length*MOCK_PER_CH:Math.min(MOCK_BOARD_N,BOARD_MCQ.length);
    $('#app').innerHTML=`<div class="card intro"><h1>Mock test</h1>
      <p class="muted" style="margin:6px 0 0">Practise under exam conditions. Pass with 33% or more to earn 15 points.</p>
      <div class="mode">
        <button class="${mode==='mixed'?'on':''}" onclick="go('mock',{mode:'mixed'})"><b>Full syllabus mix</b><span>${CHAPTERS.length*MOCK_PER_CH} questions, 2 from every chapter, from the book and board papers</span></button>
        <button class="${mode==='board'?'on':''}" onclick="go('mock',{mode:'board'})"><b>Board papers only</b><span>${MOCK_BOARD_N} questions from previous CBSE board papers (2020–2026)</span></button>
      </div>
      <ul class="rules"><li>${n} questions in ${MOCK_MIN} minutes – it submits itself when time runs out</li><li>New questions every time</li><li>Jump between questions and change answers before you submit</li><li>Every answer is explained at the end</li></ul>
      <button class="btn primary" id="start">Start the ${mode==='mixed'?'full syllabus':'board papers'} test</button></div>`;
    $('#start').onclick=()=>{
      const qs=mode==='mixed'
        ? shuffle(CHAPTERS.flatMap(c=>shuffle(c.mcq).slice(0,MOCK_PER_CH).map(q=>prepQ(q,c.id))))
        : shuffle(CHAPTERS.flatMap(c=>c.mcq.slice(c.nBook).map(q=>[q,c.id]))).slice(0,MOCK_BOARD_N).map(([q,id])=>prepQ(q,id));
      state={phase:'test',mode,qs,ans:Array(qs.length).fill(null),qi:0,end:Date.now()+MOCK_MIN*60000};
      timerId=setInterval(tick,1000); Mock();
    };
    return;
  }
  if(phase==='test'){
    const {qs,ans,qi}=state,q=qs[qi],answered=ans.filter(a=>a!=null).length,ch=byId(q.ch);
    $('#app').innerHTML=`<div class="card q-box ${ch.unit}" style="margin-top:24px">
      <div class="q-meta"><span>Question ${qi+1} of ${qs.length} · ${answered} answered</span><span class="timer" id="tm" role="timer"></span></div>
      <div class="bar"><i style="width:${answered/qs.length*100}%;background:var(--maroon)"></i></div>
      <div class="row" style="gap:6px"><span class="pill unit">${ch.icon} Ch ${ch.id}</span><span class="src ${q.src.startsWith('Board')?'board':''}">${esc(q.src)}</span></div>
      <div class="q-text">${esc(q.q)}</div>
      ${q.opts.map((o,i)=>`<button class="opt ${ans[qi]===i?'sel':''}" data-i="${i}"><span class="k">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}
      <div class="row" style="justify-content:space-between;margin-top:10px">
        <button class="btn" id="pv" ${qi===0?'disabled':''}>← Previous</button>
        <div class="row"><button class="btn" id="sub">Submit test</button>${qi<qs.length-1?'<button class="btn primary" id="nx">Next →</button>':''}</div>
      </div>
      <div class="qnav">${qs.map((_,i)=>`<button class="${ans[i]!=null?'ans':''} ${i===qi?'cur':''}" data-j="${i}" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div>
    </div>`;
    tick();
    document.querySelectorAll('.q-box .opt').forEach(b=>b.onclick=()=>{ans[qi]=+b.dataset.i;Mock();});
    document.querySelectorAll('.qnav button').forEach(b=>b.onclick=()=>{state.qi=+b.dataset.j;Mock();});
    $('#pv').onclick=()=>{state.qi--;Mock();};
    if($('#nx'))$('#nx').onclick=()=>{state.qi++;Mock();};
    $('#sub').onclick=()=>{const left=qs.length-answered;confirmBox(left?`You have ${left} unanswered question${left>1?'s':''}. Submit anyway?`:'Submit your test?',finishMock,'Submit test');};
    return;
  }
  const {qs,ans,score,timeUsed}=state;
  const byCh={};qs.forEach((q,i)=>{byCh[q.ch]=byCh[q.ch]||[0,0];byCh[q.ch][1]++;if(ans[i]===q.ans)byCh[q.ch][0]++;});
  const weak=Object.entries(byCh).filter(([,v])=>v[0]<v[1]).map(([k])=>+k);
  $('#app').innerHTML=`<div class="card result" style="margin-top:24px"><div class="big">${score}/${qs.length}</div>
    <p style="font-size:20px;margin:12px 0 4px;font-weight:700">${Math.round(score/qs.length*100)}% in ${fmt(timeUsed)}</p>
    ${weak.length?`<p class="muted">Revise: ${weak.map(id=>`<a href="#" onclick="go('chapter',{id:${id}});return false">${byId(id).icon} Ch ${id}</a>`).join(', ')}</p>`:'<p class="muted">Every chapter correct!</p>'}
    <span class="xpgain">${score/qs.length>=PASS?'Passed! +15 points':'Not passed – score 33% or more to earn 15 points'}</span>
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn primary" onclick="go('mock',{mode:'${state.mode||'mixed'}'})">New mock test</button><button class="btn" onclick="go('progress')">Open My lab</button></div></div>
    <div class="sec"><h2>Answer review</h2><span class="muted">${qs.length-score} to look at</span></div>
    ${qs.map((q,i)=>{const ok=ans[i]===q.ans;return `<div class="card review ${ok?'':'x'}"><div class="meta">Q${i+1} · ${byId(q.ch).icon} Ch ${q.ch} · ${esc(q.src)}</div><div style="font-weight:700;margin:4px 0">${esc(q.q)}</div>
      <div>${ok?'✓':'✗'} Your answer: ${ans[i]==null?'<i>not answered</i>':esc(q.opts[ans[i]])}</div>${ok?'':`<div style="color:var(--good);font-weight:700">Correct: ${esc(q.opts[q.ans])}</div>`}<div class="muted" style="font-size:15px;margin-top:4px">${esc(q.why)}</div></div>`;}).join('')}`;
}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function tick(){
  if(state.phase!=='test')return;
  const left=Math.max(0,Math.round((state.end-Date.now())/1000));
  const t=$('#tm'); if(t){t.textContent='⏱ '+fmt(left);t.classList.toggle('low',left<300);}
  if(left<=0)finishMock();
}
function finishMock(){
  if(state.phase!=='test')return;
  clearInterval(timerId);timerId=null;
  const score=state.qs.reduce((n,q,i)=>n+(state.ans[i]===q.ans),0);
  const timeUsed=Math.min(MOCK_MIN*60,MOCK_MIN*60-Math.max(0,Math.round((state.end-Date.now())/1000)));
  S.answered+=state.ans.filter(a=>a!=null).length;
  S.mocks.push({date:new Date().toISOString(),score,total:state.qs.length,time:timeUsed,mode:state.mode});save();
  Object.assign(state,{phase:'result',score,timeUsed});
  if(score/state.qs.length>=.8)confetti();
  if(score/state.qs.length>=PASS)addPoints(15,'Mock test passed'); else markStudied();
  Mock();window.scrollTo(0,0);
}



// ---------- my lab ----------
function Progress(){
  const st=streak(), done=Object.values(S.done).filter(Boolean).length;
  const totalCards=CHAPTERS.reduce((a,c)=>a+c.cards.length,0);
  $('#app').innerHTML=`
  <section class="card lab" style="margin-top:24px">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><h1>${S.name?esc(S.name)+'’s lab':'My lab'}</h1><button class="btn ghost" id="rename">${S.name?'Change name':'Add your name'}</button></div>
    <div class="stats3" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
      <div class="stat"><b>${S.monthPts[monthKey()]||0} ⭐</b><span>Points this month</span></div>
      <div class="stat"><b>${S.points}</b><span>Total points</span></div>
      <div class="stat"><b>${st} 🔥</b><span>Day streak</span></div>
      <div class="stat"><b>${done}/13</b><span>Chapters done</span></div>
      <div class="stat"><b>${knownTotal()}/${totalCards}</b><span>Flashcards known</span></div>
      <div class="stat"><b>${S.mocks.length?Math.max(...S.mocks.map(m=>Math.round(m.score/m.total*100)))+'%':'–'}</b><span>Best mock test</span></div>
    </div>
  </section>
  <section class="card" style="padding:16px 20px;margin-top:14px;display:flex;gap:12px;align-items:center"><span style="font-size:24px">📨</span><span>Your points for each month are sent to your teacher automatically. ${S.lastSync?'<span class="muted">Last sent '+new Date(S.lastSync).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})+'.</span>':''}</span></section>
  <div class="sec"><h2>Badges</h2><span class="muted">${S.badges.length} of ${BADGES.length} unlocked</span></div>
  <div class="badges">${BADGES.map(([id,ic,name,desc])=>`<div class="badge ${S.badges.includes(id)?'got':''}"><div class="ic">${ic}</div><b>${name}</b><span>${desc}</span></div>`).join('')}</div>
  <div class="sec"><h2>Chapter by chapter</h2></div>
  <div class="card tbl"><table><thead><tr><th>Done</th><th>Chapter</th><th>Best quiz</th><th>Cards known</th></tr></thead><tbody>
  ${CHAPTERS.map(c=>`<tr class="${c.unit}"><td><input type="checkbox" class="check" data-id="${c.id}" ${S.done[c.id]?'checked':''} aria-label="Mark chapter ${c.id} done"></td><td><span class="symsm">${c.icon}</span><a href="#" onclick="go('chapter',{id:${c.id}});return false" style="color:inherit">${esc(c.title)}</a></td><td>${S.bestPct[c.id]!=null?`${S.bestPct[c.id]}%`:'<span class="muted">–</span>'}</td><td>${(S.known[c.id]||[]).length}/${c.cards.length}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="sec"><h2>Mock test history</h2></div>
  ${S.mocks.length?`<div class="card tbl"><table><thead><tr><th>Date</th><th>Type</th><th>Score</th><th>Time</th></tr></thead><tbody>${S.mocks.slice().reverse().map(m=>`<tr><td>${new Date(m.date).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</td><td>${m.mode==='board'?'Board papers':'Full mix'}</td><td><b>${Math.round(m.score/m.total*100)}%</b> <span class="muted">(${m.score}/${m.total})</span></td><td>${fmt(m.time)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="card" style="padding:20px"><span class="muted">No mock tests yet. Pass one to earn 15 points.</span> <button class="btn primary" style="margin-left:8px" onclick="go('mock')">Take a mock test</button></div>`}
  <div style="margin-top:26px"><button class="btn" id="reset">Reset all progress</button></div>`;
  document.querySelectorAll('input[data-id]').forEach(b=>b.onchange=()=>{const id=b.dataset.id;S.done[id]=b.checked;save();markStudied();Progress();});
  $('#rename').onclick=askName;
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{if(!S.name){toast('Add your name first');askName();return;}
    try{await navigator.clipboard.writeText(pointsMessage(b.dataset.copy));toast('Message copied – paste it into an email to '+TEACHER_EMAIL);}catch(e){toast('Copy is blocked here – write down your points and email them');}});
  $('#reset').onclick=()=>confirmBox('Erase all points, badges, scores and mock history? This cannot be undone.',()=>{const keep={name:S.name,device:S.device};S=Object.assign(JSON.parse(JSON.stringify(DEF)),keep,{named:true});save();render();},'Erase everything');
}
render();
if(!S.name)setTimeout(askName,400);
syncPoints();
</script>
