<title>Study Saathi – Class X Science · S.R. Sukhani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7FB; --card:#FFFFFF; --ink:#151A2E; --muted:#5D6479; --line:#E2E5EE;
  --maroon:#7B1E2B; --maroon-2:#5E1520; --blue:#22358F; --butter:#F6E7A1; --butter-ink:#5A4A00;
  --chem:#C2410C; --chem-soft:#FDEBE1; --bio:#23804F; --bio-soft:#E1F3E8; --phy:#2B4ACB; --phy-soft:#E4E9FB;
  --good:#1F8A4C; --good-soft:#E2F5EA; --bad:#C0352B; --bad-soft:#FBE4E2;
  --r-lg:20px; --r:14px; --r-sm:10px;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Atkinson Hyperlegible',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10131F; --card:#181C2C; --ink:#EEF0F7; --muted:#9AA1B8; --line:#2A3046;
  --maroon:#E0697A; --maroon-2:#C65466; --blue:#8EA2FF; --butter:#F6E7A1; --butter-ink:#3D3200;
  --chem:#FF8C55; --chem-soft:#3A2218; --bio:#5FCB8E; --bio-soft:#16301F; --phy:#8EA2FF; --phy-soft:#1C2445;
  --good:#5FCB8E; --good-soft:#16301F; --bad:#F08A80; --bad-soft:#3A1E1C;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.015em;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
a{color:var(--blue)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px 110px}

/* ---------- top bar ---------- */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
.topbar .in{max-width:1040px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:14px;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.brand img{width:76px;height:76px;object-fit:contain;border-radius:16px;background:#fff;border:1px solid var(--line);padding:3px;flex:none}
.word{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;letter-spacing:-.03em;color:var(--maroon)}
.word span{color:var(--blue)}
.word i{font-style:normal;display:inline-grid;place-items:center;width:1.05em;height:1.05em;margin-left:2px;border-radius:7px;background:var(--maroon);color:#fff;font-size:.9em;vertical-align:-.08em}
.school{white-space:nowrap;font-family:var(--display);font-weight:700;color:var(--blue);font-size:16px;margin-top:5px}
.school span{font-weight:500;color:var(--muted)}
nav.tabs{margin-left:auto;display:flex;gap:4px}
nav.tabs button{white-space:nowrap;border:0;background:none;padding:10px 14px;border-radius:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button.on{background:var(--maroon);color:#fff}
.xpchip{white-space:nowrap;flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--butter);color:var(--butter-ink);font-weight:700;font-size:15px;border:0}
.xpchip b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--maroon);font-size:15px}
@media (max-width:1000px){
  .brand img{width:58px;height:58px}
  .word{font-size:26px} .school{font-size:15px} .school span{display:none}
  .topbar .in{gap:10px;padding:8px 14px}
  nav.tabs{position:fixed;left:10px;right:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px;justify-content:space-around;box-shadow:0 10px 30px rgba(20,26,46,.18);margin:0}
  nav.tabs button{flex:1;justify-content:center;flex-direction:column;gap:2px;font-size:13px;padding:8px 4px}
  .topbar .xpchip{margin-left:auto}
}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
.btn{border:1.5px solid var(--line);background:var(--card);padding:11px 18px;border-radius:var(--r);font-weight:700}
.btn:hover{border-color:var(--maroon)}
.btn.primary{background:var(--maroon);border-color:var(--maroon);color:#fff}
.btn.primary:hover{background:var(--maroon-2)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:6px 0}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.sec h2{font-size:26px}
.pill{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;font-weight:700}
.Chemistry{--u:var(--chem);--us:var(--chem-soft)} .Biology{--u:var(--bio);--us:var(--bio-soft)} .Physics{--u:var(--phy);--us:var(--phy-soft)}
.pill.unit{background:var(--us);color:var(--u)}
.src{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--phy-soft);color:var(--blue)}
.src.board{background:var(--butter);color:var(--butter-ink)}

/* ---------- home hero ---------- */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:24px}
.lab{padding:24px;position:relative;overflow:hidden}
.lab{display:flex;flex-direction:column}
.lab .acts{margin-top:22px}
.lab h1{font-size:clamp(30px,4.2vw,44px);font-weight:800}
.lab p{margin:8px 0 0;color:var(--muted);max-width:46ch}
.lvl{display:flex;gap:16px;align-items:center;margin-top:22px}
.tile-lg{width:92px;height:92px;flex:none;border-radius:16px;background:var(--maroon);color:#fff;position:relative;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:40px}
.tile-lg small{position:absolute;top:7px;left:9px;font-size:13px;font-weight:700;opacity:.85}
.tile-lg em{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-style:normal;font-size:11px;font-weight:600;opacity:.9}
.lvl .meta{flex:1;min-width:0}
.lvl .meta b{font-family:var(--display);font-size:22px}
.xpbar{height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.xpbar i{display:block;height:100%;background:var(--maroon);border-radius:999px;transition:width .6s}
.stats3{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.stat span{font-size:14px;color:var(--muted)}
.qotd{padding:22px;background:var(--blue);color:#fff;border:0;display:flex;flex-direction:column}
.qotd h3{font-size:20px;display:flex;align-items:center;gap:8px}
.qotd .q{font-weight:700;font-size:18px;margin:12px 0}
.qotd .opt{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.qotd .opt:hover:not(:disabled){border-color:#fff}
.qotd .opt .k{background:rgba(255,255,255,.18);color:#fff}
.qotd .opt.right{background:#1F8A4C;border-color:#7BE0A6}
.qotd .opt.wrong{background:#9B2C24;border-color:#F3A49C}
.qotd .note{font-size:15px;opacity:.9;margin-top:auto;padding-top:8px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
@media (max-width:520px){.stats3{grid-template-columns:repeat(2,1fr)}}

/* ---------- periodic chapter grid ---------- */
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend button{border:1.5px solid var(--line);background:var(--card);padding:6px 14px;border-radius:999px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px}
.legend button i{width:10px;height:10px;border-radius:3px;background:var(--u,var(--ink))}
.legend button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.ptable{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.el{position:relative;text-align:left;border:2px solid var(--u);background:var(--card);border-radius:var(--r);padding:12px 12px 14px;min-height:168px;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.el:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--us)}
.el .no{font-family:var(--display);font-weight:700;color:var(--u);font-size:15px}
.el .sym{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;color:var(--u);margin:6px 0 8px;letter-spacing:-.03em}
.el .nm{font-weight:700;font-size:15px;line-height:1.3}
.el .ft{margin-top:auto;padding-top:10px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.el .meter{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.el .meter i{display:block;height:100%;background:var(--u)}
.el.done{background:var(--us)}
.el .tick{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--u);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ch{padding:16px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);display:flex;gap:14px;align-items:flex-start;transition:transform .12s,border-color .12s}
.ch:hover{transform:translateY(-2px);border-color:var(--u)}
.ch.done{border-color:var(--u)}
.ch .ic{font-size:24px;width:48px;height:48px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--us)}
.ch .t{font-weight:700;line-height:1.3}
.ch .m{font-size:14px;color:var(--muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.done-tag{color:var(--good);font-weight:700}
.chhead .ic{font-size:34px;width:72px;height:72px;flex:none;border-radius:16px;display:grid;place-items:center;background:var(--us)}
/* ---------- chapter ---------- */
.back{margin:20px 0 12px}
.chhead{display:flex;gap:18px;align-items:center;padding:20px;border-color:var(--u);border-width:2px}
.chhead .tile-lg{background:var(--u)}
.chhead h1{font-size:clamp(26px,3.4vw,36px);font-weight:800}
.chhead .right{margin-left:auto}
.donebtn{display:flex;align-items:center;gap:8px;border:2px solid var(--u);color:var(--u);background:var(--card);padding:9px 14px;border-radius:var(--r);font-weight:700}
.donebtn.on{background:var(--u);color:#fff}
@media (max-width:640px){.chhead{flex-wrap:wrap}.chhead .tile-lg{width:68px;height:68px;font-size:30px}.chhead .right{margin-left:0;width:100%}.donebtn{width:100%;justify-content:center}}
.subtabs{display:flex;gap:6px;margin:18px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:5px;width:max-content;max-width:100%}
.subtabs button{border:0;background:none;padding:9px 18px;border-radius:10px;font-weight:700;color:var(--muted)}
.subtabs button.on{background:var(--u);color:#fff}
.note{padding:20px 24px;margin-bottom:12px;border-left:5px solid var(--u)}
.note h3{font-size:20px;margin-bottom:8px}
.note ul{margin:0;padding-left:20px;max-width:75ch}
.note li{margin:6px 0}

/* flashcards */
.fc-stage{perspective:1400px;max-width:600px;margin:0 auto}
.fc{position:relative;min-height:280px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.3,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r-lg);padding:44px 28px 36px;display:grid;place-items:center;text-align:center;border:2px solid var(--u);background:var(--card)}
.fc .front .t{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.2}
.fc .front .t.long{font-family:var(--body);font-size:19px;font-weight:700;line-height:1.45}
.fc .backf{transform:rotateY(180deg);background:var(--us);font-size:18px;overflow:auto}
.fc.flip{cursor:default}
.fc .hint{position:absolute;bottom:12px;left:0;right:0;font-size:14px;color:var(--muted)}
.fc .tag{position:absolute;top:14px;left:16px}
.fc-ctrl{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.fc-count{text-align:center;color:var(--muted);margin-top:12px;font-size:15px}

.fcq{max-width:680px;margin:0 auto;padding:22px;border:2px solid var(--u)}
.fq{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.25;margin:14px 0 16px}
.fq.long{font-family:var(--body);font-size:19px;font-weight:700;line-height:1.45}
.fcin{max-width:600px;margin:14px auto 0}
.fcin .explain{margin:10px 0 0}
#ans{width:100%;font:inherit;padding:12px 14px;border-radius:var(--r);border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;min-height:84px}
#ans:focus{border-color:var(--u);outline:none}
.fans{margin-top:12px;padding:14px 16px;border-radius:var(--r);background:var(--us)}
.fans p{margin:4px 0 0}
.fcact{display:flex;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
@media (max-width:520px){.fcact{flex-direction:column-reverse}.fcact .acts2{display:grid;grid-template-columns:1fr 1fr}.fcact .acts2 .btn:only-child{grid-column:1/-1}.fcact .arrows{justify-content:center}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* quiz */
.filters{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.filters button{border:1.5px solid var(--line);background:var(--card);padding:6px 14px;border-radius:999px;font-weight:700;font-size:15px}
.filters button.on{border-color:var(--u,var(--maroon));background:var(--u,var(--maroon));color:#fff}
.q-box{padding:22px;max-width:720px;margin:0 auto}
.q-meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px;margin-bottom:10px;gap:10px}
.combo{font-weight:700;color:var(--chem);font-size:15px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--u,var(--maroon));transition:width .3s}
.q-text{font-size:20px;font-weight:700;margin:10px 0 16px;line-height:1.45}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);padding:12px 14px;border-radius:var(--r);margin-bottom:9px;transition:border-color .15s,transform .1s}
.opt .k{width:30px;height:30px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-size:14px;font-weight:700;flex:none;font-family:var(--display)}
.opt:hover:not(:disabled){border-color:var(--u,var(--maroon))}
.opt:active:not(:disabled){transform:scale(.99)}
.opt.sel{border-color:var(--maroon);background:var(--butter);color:var(--butter-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.right .k{background:var(--good);color:#fff} .opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.explain{padding:14px 16px;border-radius:var(--r);background:var(--bg);margin:8px 0 16px}
.explain b.ok{color:var(--good)} .explain b.no{color:var(--bad)}
.result{text-align:center;padding:30px 22px;max-width:720px;margin:0 auto}
.big{font-family:var(--display);font-size:68px;font-weight:800;line-height:1;color:var(--maroon)}
.xpgain{display:inline-block;margin-top:12px;background:var(--butter);color:var(--butter-ink);font-weight:700;padding:6px 14px;border-radius:999px}

/* mock */
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:5px 12px;border-radius:10px;background:var(--phy-soft);color:var(--blue)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.qnav button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:700}
.qnav button.ans{background:var(--butter);border-color:var(--butter);color:var(--butter-ink)}
.qnav button.cur{outline:3px solid var(--maroon);outline-offset:1px}
.review{padding:14px 18px;margin-bottom:10px;border-left:5px solid var(--good)}
.review.x{border-left-color:var(--bad)}
.review .meta{font-size:13px;color:var(--muted)}
.intro{padding:26px;max-width:700px;margin:24px auto 0}
.intro h1{font-size:34px;font-weight:800}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.mode button{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px}
.mode button.on{border-color:var(--maroon);background:var(--butter);color:var(--butter-ink)}
.mode b{display:block;font-family:var(--display);font-size:19px;margin-bottom:4px}
.mode span{font-size:15px;opacity:.85}
@media (max-width:640px){.mode{grid-template-columns:1fr}}
.rules{padding-left:20px;color:var(--muted)}

/* my lab (progress) */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.badge{padding:16px;border-radius:var(--r);border:1.5px dashed var(--line);text-align:center;background:var(--card)}
.badge .ic{font-size:34px;line-height:1;filter:grayscale(1);opacity:.35}
.badge b{display:block;font-family:var(--display);font-size:17px;margin-top:8px}
.badge span{font-size:14px;color:var(--muted)}
.badge.got{border:2px solid var(--maroon);background:var(--butter);color:var(--butter-ink)}
.badge.got .ic{filter:none;opacity:1}
.badge.got span{color:var(--butter-ink)}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700;font-size:14px}
.tbl{overflow-x:auto}
.check{width:20px;height:20px;accent-color:var(--maroon)}
.symsm{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--us);color:var(--u);font-family:var(--display);font-weight:800;margin-right:8px;font-size:14px}

/* modal + toast + confetti */
.modal{position:fixed;inset:0;background:rgba(16,19,31,.55);display:grid;place-items:center;z-index:20;padding:18px}
.modal .card{padding:26px;max-width:420px;width:100%}
.modal h2{font-size:26px;margin-bottom:6px}
.modal input{width:100%;font:inherit;padding:12px 14px;border-radius:var(--r);border:2px solid var(--line);background:var(--bg);color:var(--ink);margin:14px 0}
.modal input:focus{border-color:var(--maroon);outline:none}
#toasts{position:fixed;top:96px;right:16px;z-index:30;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--r);font-weight:700;box-shadow:0 10px 24px rgba(0,0,0,.2);animation:tin .3s ease-out;max-width:300px}
.toast.badge-t{background:var(--butter);color:var(--butter-ink);border:2px solid var(--maroon)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:1000px){#toasts{top:auto;bottom:96px;left:16px;right:16px}.toast{max-width:none}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:25}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.fc{transition:none}}
footer{margin-top:48px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>

 id:1, unit:"Chemistry", title:"Chemical Reactions and Equations", icon:"⚗️",
 notes:[
  ["§1.1 Chemical equations",["A chemical change can be spotted by: change in state, change in colour, evolution of a gas, or change in temperature.","Burning magnesium ribbon gives a dazzling white flame and white magnesium oxide powder: 2Mg + O₂ → 2MgO.","A complete equation shows reactants, products and their physical states — (s), (g), (l), (aq). Conditions such as heat, light or a catalyst go above or below the arrow.","Balanced equation: the number of atoms of each element is the same on both sides, because mass is neither created nor destroyed (law of conservation of mass). Balancing is done by the hit-and-trial method."]],
  ["§1.2.1 Combination reaction",["Two or more substances combine to form a single product.","Quick lime + water → slaked lime with release of heat: CaO + H₂O → Ca(OH)₂.","Slaked lime used for whitewashing reacts slowly with CO₂ in air to form a thin, shiny layer of calcium carbonate.","Burning of coal (C + O₂ → CO₂) and forming water from H₂ and O₂ are also combination reactions.","Exothermic reactions give out heat (burning of natural gas, respiration, decomposition of vegetable matter into compost). Respiration is exothermic because glucose combines with oxygen and releases energy."]],
  ["§1.2.2 Decomposition reaction",["A single reactant breaks down into simpler products — the opposite of combination.","Thermal: 2FeSO₄ → Fe₂O₃ + SO₂ + SO₃ (green crystals turn brown, smell of burning sulphur). CaCO₃ → CaO + CO₂ (quick lime, used for cement). 2Pb(NO₃)₂ → 2PbO + 4NO₂ + O₂ (brown fumes).","Electrolytic: electrolysis of water, 2H₂O → 2H₂ + O₂. The volume of hydrogen collected is double that of oxygen.","Photolytic (light): 2AgCl → 2Ag + Cl₂; 2AgBr → 2Ag + Br₂. Silver chloride turns grey in sunlight. Used in black-and-white photography.","Decomposition reactions need energy (heat, light or electricity), so they are endothermic."]],
  ["§1.2.3 Displacement reaction",["A more reactive element displaces a less reactive one from its compound.","Iron nail in copper sulphate: Fe + CuSO₄ → FeSO₄ + Cu. The nail turns brownish and the blue solution fades.","Zinc and lead also displace copper: Zn + CuSO₄ → ZnSO₄ + Cu; Pb + CuCl₂ → PbCl₂ + Cu."]],
  ["§1.2.4 Double displacement reaction",["Ions are exchanged between the reactants.","Na₂SO₄ + BaCl₂ → BaSO₄ + 2NaCl — a white insoluble precipitate of barium sulphate forms.","A reaction that produces a precipitate is called a precipitation reaction."]],
  ["§1.2.5 Oxidation and reduction",["Oxidation: gain of oxygen or loss of hydrogen. Reduction: loss of oxygen or gain of hydrogen.","Heating copper powder in air gives black copper(II) oxide: 2Cu + O₂ → 2CuO.","Passing hydrogen over hot CuO: CuO + H₂ → Cu + H₂O. CuO is reduced; H₂ is oxidised.","When one substance is oxidised and another reduced in the same reaction, it is a redox reaction. Example: ZnO + C → Zn + CO."]],
  ["§1.3 Oxidation in everyday life",["Corrosion: a metal is attacked by moisture, acids etc. Iron gets a reddish-brown coating (rust), silver turns black, copper turns green. Corrosion damages car bodies, bridges, iron railings and ships.","Rancidity: fats and oils get oxidised and their smell and taste change.","To prevent rancidity, antioxidants are added and bags of chips are flushed with nitrogen."]]
 ],
 cards:[["Exothermic reaction","A reaction that gives out heat, e.g. respiration, burning natural gas."],["Endothermic reaction","A reaction that absorbs energy, e.g. decomposition of calcium carbonate."],["Redox reaction","One reactant is oxidised and another is reduced in the same reaction."],["Precipitation reaction","A reaction that forms an insoluble substance (precipitate), e.g. BaSO₄."],["Why balance an equation?","Atoms are neither created nor destroyed – law of conservation of mass."],["Rancidity – prevention","Add antioxidants; flush packets with nitrogen; store in airtight containers."],["Silver chloride in sunlight","Turns grey: 2AgCl → 2Ag + Cl₂ (photolytic decomposition)."]],

  ["Which statements about 2PbO + C → 2Pb + CO₂ are incorrect? (a) Lead is getting reduced (b) CO₂ is getting oxidised (c) Carbon is getting oxidised (d) Lead oxide is getting reduced",["(a) and (b)","(a) and (c)","(a), (b) and (c)","All"],0,"Lead is formed, not reduced itself — PbO is reduced. CO₂ is a product, not oxidised. Carbon is oxidised and PbO is reduced, so (c) and (d) are correct.","NCERT Ex. 1"],
  ["Fe₂O₃ + 2Al → Al₂O₃ + 2Fe is an example of a:",["Combination reaction","Double displacement reaction","Decomposition reaction","Displacement reaction"],3,"Aluminium displaces iron from iron oxide.","NCERT Ex. 2"],
  ["What happens when dilute hydrochloric acid is added to iron filings?",["Hydrogen gas and iron chloride are produced","Chlorine gas and iron hydroxide are produced","No reaction takes place","Iron salt and water are produced"],0,"Fe + 2HCl → FeCl₂ + H₂.","NCERT Ex. 3"],
  ["A shiny brown element X becomes black on heating in air. X and the black compound are:",["Copper and copper(II) oxide","Iron and iron oxide","Magnesium and magnesium oxide","Silver and silver sulphide"],0,"2Cu + O₂ → 2CuO (black).","NCERT Ex. 17"],
  ["Why are oil- and fat-containing foods flushed with nitrogen?",["To prevent them from getting oxidised (rancid)","To add flavour","To make them crisp","To kill bacteria by heating"],0,"Nitrogen keeps oxygen away, preventing rancidity.","NCERT Ex. 19"],
  ["In the electrolysis of water, the gas collected in double volume is:",["Hydrogen","Oxygen","Chlorine","Carbon dioxide"],0,"2H₂O → 2H₂ + O₂; twice as many hydrogen molecules form.","Book §1.2.2"],
  ["Heating ferrous sulphate crystals is an example of:",["Thermal decomposition","Combination","Displacement","Photolytic decomposition"],0,"2FeSO₄ → Fe₂O₃ + SO₂ + SO₃ on heating.","Book §1.2.2"],
  ["Na₂SO₄ + BaCl₂ → BaSO₄ + 2NaCl. The white precipitate is of:",["Barium sulphate","Sodium chloride","Barium chloride","Sodium sulphate"],0,"BaSO₄ is insoluble; this is a precipitation (double displacement) reaction.","Book §1.2.4"],
  ["In CuO + H₂ → Cu + H₂O, the substance that is oxidised is:",["H₂","CuO","Cu","H₂O"],0,"Hydrogen gains oxygen to form water.","Book §1.2.5"],
  ["Respiration is considered an exothermic reaction because:",["Glucose combines with oxygen and releases energy","It absorbs heat from the body","It needs sunlight","It produces a precipitate"],0,"C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy.","NCERT Ex. 10"]
 ]

{
 id:2, unit:"Chemistry", title:"Acids, Bases and Salts", icon:"🧪",
 notes:[
  ["§2.1 Indicators",["Acids are sour and turn blue litmus red. Bases are bitter, soapy to touch and turn red litmus blue.","Litmus is a natural indicator extracted from lichen. Turmeric is another natural indicator.","Synthetic indicators: methyl orange and phenolphthalein.","Olfactory indicators change smell in acids/bases: onion, vanilla essence, clove oil."]],
  ["§2.1.2–2.1.6 Reactions",["Acid + metal → salt + hydrogen gas. Zn + H₂SO₄ → ZnSO₄ + H₂ (H₂ burns with a pop sound).","Some bases (NaOH) also react with metals: 2NaOH + Zn → Na₂ZnO₂ (sodium zincate) + H₂.","Metal carbonate/hydrogencarbonate + acid → salt + CO₂ + water. CO₂ turns lime water milky; excess CO₂ makes it clear again (soluble Ca(HCO₃)₂).","Acid + base → salt + water: neutralisation. NaOH + HCl → NaCl + H₂O.","Metal oxides react with acids → salt + water, so metal oxides are basic oxides.","Non-metal oxides react with bases → salt + water, so they are acidic oxides."]],
  ["§2.2 Acids and bases in water",["Acids give H⁺ ions in water (as H₃O⁺, hydronium). Bases give OH⁻ ions.","Glucose and alcohol contain hydrogen but don't give H⁺ ions in water, so they are not acids.","Dry HCl gas doesn't change dry litmus — H⁺ ions form only in water.","Bases soluble in water are called alkalis. All alkalis are bases, but not all bases are alkalis.","Diluting acid: always add acid to water slowly with stirring — the process is highly exothermic."]],
  ["§2.3 pH scale",["pH 0–14 measures H⁺ ion concentration. pH 7 neutral, <7 acidic, >7 basic. Universal indicator shows different colours.","Our body works within pH 7.0 to 7.8.","Rain with pH less than 5.6 is acid rain; it can make river water acidic and harm aquatic life.","Stomach makes HCl; excess causes indigestion. Antacids (mild bases like milk of magnesia, Mg(OH)₂) neutralise it.","Tooth decay starts when the pH in the mouth is lower than 5.5. Tooth enamel (calcium hydroxyapatite) is the hardest substance in the body.","Bee-sting leaves an acid; baking soda gives relief. Nettle stings inject methanoic acid; dock plant leaves are rubbed on the area.","Natural acids: vinegar – acetic acid; orange – citric acid; tamarind – tartaric acid; tomato – oxalic acid; sour milk (curd) – lactic acid; ant sting – methanoic acid."]],
  ["§2.4 Salts and chemicals from common salt",["Salts of a strong acid and strong base are neutral (pH 7). Strong acid + weak base → acidic salt; strong base + weak acid → basic salt.","Common salt (NaCl) occurs in sea water; deposits of solid salt are called rock salt.","Chlor-alkali process: electrolysis of brine. 2NaCl(aq) + 2H₂O → 2NaOH + Cl₂ (anode) + H₂ (cathode).","Bleaching powder: Ca(OH)₂ + Cl₂ → CaOCl₂ + H₂O. Used for bleaching cotton/linen and wood pulp, as an oxidising agent, and to disinfect drinking water.","Baking soda (NaHCO₃): NaCl + H₂O + CO₂ + NH₃ → NH₄Cl + NaHCO₃. Mild non-corrosive base. Used in baking powder, antacids, and soda-acid fire extinguishers.","Washing soda (Na₂CO₃·10H₂O): made by recrystallising sodium carbonate. Used in glass, soap and paper industries, making borax, cleaning, and removing permanent hardness of water."]],
  ["§2.4.4 Water of crystallisation",["Fixed number of water molecules in one formula unit of a salt.","Blue copper sulphate crystals (CuSO₄·5H₂O) turn white on heating as they lose water; adding water makes them blue again.","Gypsum: CaSO₄·2H₂O.","Plaster of Paris (CaSO₄·½H₂O) is made by heating gypsum at 373 K. Mixed with water it sets back into hard gypsum. Used for supporting fractured bones, toys, decoration and smooth surfaces. Store it in moisture-proof containers."]]
 ],
 cards:[["Olfactory indicators","Onion, vanilla essence, clove oil – smell changes in acid/base."],["Neutralisation","Acid + base → salt + water"],["pH below which tooth decay starts","5.5"],["Chlor-alkali process products","NaOH, Cl₂ and H₂"],["Plaster of Paris","CaSO₄·½H₂O – made by heating gypsum at 373 K."],["Washing soda","Na₂CO₃·10H₂O"],["Baking soda","NaHCO₃ – mild, non-corrosive base."],["Why add acid to water, not water to acid?","Mixing is highly exothermic; adding water to acid can splash acid and break the glass."]],

  ["10 mL NaOH is neutralised by 8 mL of an HCl solution. How much of the same HCl is needed for 20 mL of the same NaOH?",["4 mL","8 mL","12 mL","16 mL"],3,"Double the base needs double the acid: 16 mL.","NCERT Ex. 3"],
  ["Which type of medicine is used for treating indigestion?",["Antibiotic","Analgesic","Antacid","Antiseptic"],2,"Antacids neutralise excess stomach acid.","NCERT Ex. 4"],
  ["Solutions A–E show pH 4, 1, 11, 7 and 9. Which is strongly alkaline?",["A","B","C","E"],2,"pH 11 is the highest — strongly alkaline. B (pH 1) is strongly acidic; D (pH 7) is neutral.","NCERT Ex. 9"],
  ["Fresh milk has pH 6. As it turns into curd, its pH will:",["Decrease","Increase","Stay at 6","Become 7"],0,"Lactic acid forms, so the milk becomes more acidic.","NCERT Ex. 11"],

{
 id:3, unit:"Chemistry", title:"Metals and Non-metals", icon:"🔩",
 notes:[
  ["§3.1 Physical properties",["Metals: lustrous, generally hard, malleable (beaten into sheets — gold and silver are the most malleable), ductile (drawn into wires — gold is the most ductile), good conductors of heat (silver and copper are the best), sonorous.","Exceptions among metals: mercury is liquid at room temperature; sodium and potassium are soft enough to cut with a knife and have low melting points; gallium and caesium melt on your palm; lead and mercury are poor conductors of heat.","Non-metals: solids or gases (bromine is liquid), not lustrous, brittle, poor conductors.","Exceptions among non-metals: iodine is lustrous; diamond (carbon) is the hardest natural substance with a very high melting point; graphite conducts electricity."]],
  ["§3.2 Chemical properties of metals",["Metal + oxygen → metal oxide (basic). Aluminium oxide and zinc oxide are amphoteric: they react with both acids and bases.","K and Na react so vigorously that they catch fire in air, so they are kept in kerosene. Mg, Al, Zn, Pb form a protective oxide layer. Silver and gold don't react with oxygen even at high temperature.","Anodising: aluminium is given a thicker oxide layer to resist corrosion.","Metal + water: K and Na react violently with cold water; Ca reacts less violently and floats (H₂ bubbles stick to it); Mg reacts with hot water; Al, Fe, Zn react only with steam; Pb, Cu, Ag, Au don't react.","Metal + dilute acid → salt + H₂. With nitric acid, H₂ is usually not evolved (HNO₃ is a strong oxidising agent), except with Mg and Mn and very dilute HNO₃.","Aqua regia: 3 parts conc. HCl + 1 part conc. HNO₃. Dissolves gold and platinum.","A more reactive metal displaces a less reactive one from its salt solution."]],
  ["§3.2.5 Reactivity series",["K > Na > Ca > Mg > Al > Zn > Fe > Pb > [H] > Cu > Hg > Ag > Au","Metals above hydrogen displace hydrogen from dilute acids."]],
  ["§3.3 Ionic compounds",["Formed by transfer of electrons from a metal to a non-metal, e.g. Na⁺Cl⁻, Mg²⁺(Cl⁻)₂.","Properties: hard but brittle solids; high melting and boiling points; soluble in water but not in kerosene or petrol; conduct electricity in molten state or solution (ions move), not as solids."]],
  ["§3.4 Occurrence and extraction of metals",["Minerals from which metals can be profitably extracted are ores. Impurities (gangue) are removed first.","Metals low in the series (e.g. Hg, Cu) are obtained by heating their ores alone: 2HgS + 3O₂ → 2HgO + 2SO₂; 2HgO → 2Hg + O₂.","Middle metals (Zn, Fe, Pb) are usually sulphides or carbonates. Roasting: sulphide ore heated strongly in excess air → oxide. Calcination: carbonate ore heated strongly in limited air → oxide. The oxide is then reduced with carbon: ZnO + C → Zn + CO.","Highly reactive metals displace less reactive ones from compounds: Fe₂O₃ + 2Al → 2Fe + Al₂O₃ + heat (thermit reaction — used to join railway tracks and cracked machine parts).","Metals at the top (Na, Mg, Ca, Al) are obtained by electrolytic reduction of their molten chlorides; metal deposits at the cathode, chlorine at the anode.","Electrolytic refining: impure metal = anode, thin strip of pure metal = cathode, a salt solution of the metal = electrolyte. Insoluble impurities settle as anode mud."]],
  ["§3.5 Corrosion",["Silver turns black (silver sulphide), copper gets a green coat (basic copper carbonate), iron gets a brown flaky coat (rust) in moist air.","Prevention: painting, oiling, greasing, galvanising, chrome plating, anodising, making alloys.","Galvanisation: coating iron or steel with zinc; protects even if the coating breaks.","Alloy: a homogeneous mixture of two or more metals, or a metal and a non-metal. Iron with a little carbon (≈0.05%) becomes hard and strong; stainless steel = iron + nickel + chromium (doesn't rust). If one metal is mercury, the alloy is an amalgam.","Brass = copper + zinc; bronze = copper + tin; solder = lead + tin (low melting point, used for welding electrical wires).","Alloys have lower electrical conductivity and melting point than the pure metals.","Pure gold (24 carat) is very soft; jewellery uses 22 carat gold — 22 parts gold alloyed with 2 parts silver or copper."]]
 ],
 cards:[["Amphoteric oxide","Reacts with both acids and bases: Al₂O₃, ZnO."],["Roasting","Heating a sulphide ore strongly in excess air."],["Calcination","Heating a carbonate ore strongly in limited air."],["Aqua regia","3 parts conc. HCl : 1 part conc. HNO₃. Dissolves gold."],["Galvanisation","Coating iron or steel with zinc."],["Amalgam","An alloy in which one metal is mercury."],["Thermit reaction","Fe₂O₃ + 2Al → 2Fe + Al₂O₃ + heat; joins railway tracks."],["Solder","Lead + tin; low melting point, for welding electrical wires."]],

  ["Which method is suitable for preventing an iron frying pan from rusting?",["Applying grease","Applying paint","Applying a coating of zinc","All of the above"],2,"A frying pan is heated and touches food, so grease or paint won't work; a zinc coating (galvanising) is suitable (as per the book's answer key).","NCERT Ex. 2"],
  ["An element forms an oxide with a high melting point that is soluble in water. The element is likely to be:",["Calcium","Carbon","Silicon","Iron"],0,"CaO is ionic (high melting point) and dissolves in water.","NCERT Ex. 3"],
  ["Food cans are coated with tin and not with zinc because:",["Zinc is costlier than tin","Zinc has a higher melting point than tin","Zinc is more reactive than tin","Zinc is less reactive than tin"],2,"Zinc could react with food acids.","NCERT Ex. 4"],
  ["Which metal is kept immersed in kerosene oil?",["Sodium","Magnesium","Aluminium","Zinc"],0,"Sodium catches fire if kept in the open.","Book §3.2.1"],
  ["Which of these is an amphoteric oxide?",["Al₂O₃","Na₂O","MgO","SO₂"],0,"Aluminium oxide reacts with both acids and bases.","Book §3.2.1"],
  ["Heating a carbonate ore strongly in limited air is called:",["Calcination","Roasting","Refining","Anodising"],0,"ZnCO₃ → ZnO + CO₂.","Book §3.4.4"],
  ["In electrolytic refining of a metal, the anode is:",["The impure metal","A thin strip of pure metal","Graphite","The salt solution"],0,"Pure metal deposits on the cathode; impurities collect as anode mud.","NCERT Ex. 8"],
  ["Which non-metal is a good conductor of electricity?",["Graphite","Diamond","Sulphur","Iodine"],0,"Graphite is the exception among non-metals.","Book §3.1.2"],
  ["Sulphur burns in air to give a gas. Its action on moist blue litmus is:",["Turns it red","Turns it more blue","No change","Bleaches it white instantly"],0,"SO₂ is an acidic oxide; it forms sulphurous acid with water.","NCERT Ex. 9"],
  ["Brass is an alloy of:",["Copper and zinc","Copper and tin","Lead and tin","Iron, nickel and chromium"],0,"Bronze is Cu + Sn; solder is Pb + Sn; stainless steel is Fe + Ni + Cr.","Book §3.5.1"]

{
 id:4, unit:"Chemistry", title:"Carbon and its Compounds", icon:"💎",
 notes:[
  ["§4.1 Covalent bond",["Carbon (atomic number 6) has 4 valence electrons. It cannot easily gain or lose 4 electrons, so it shares electrons — covalent bonds.","Single bond: H₂, Cl₂, CH₄. Double bond: O₂. Triple bond: N₂.","Covalent compounds have low melting/boiling points (weak intermolecular forces) and are generally poor conductors of electricity (no ions).","Allotropes of carbon: diamond (each C bonded to 4 others — rigid 3-D structure, hardest substance), graphite (each C bonded to 3 others in hexagonal layers — smooth, slippery, good conductor), fullerene C-60 (shaped like a football; named after Buckminster Fuller)."]],
  ["§4.2 Versatile nature of carbon",["Catenation: carbon forms bonds with other carbon atoms, giving long chains, branched chains and rings.","Tetravalency: carbon bonds with four other atoms (C, H, O, N, S, Cl…). Its small size makes these bonds very strong.","Saturated compounds (single bonds only) — alkanes, CₙH₂ₙ₊₂. Unsaturated compounds — alkenes (double bond, CₙH₂ₙ), alkynes (triple bond, CₙH₂ₙ₋₂).","Isomers: same molecular formula, different structures (e.g. butane — straight and branched).","Benzene C₆H₆ is a ring compound with alternating single and double bonds."]],
  ["§4.2.3–4.2.5 Functional groups, homologous series, naming",["Functional groups: halo (–Cl, –Br), alcohol (–OH), aldehyde (–CHO), ketone (>C=O), carboxylic acid (–COOH).","Homologous series: same functional group; successive members differ by –CH₂ (mass difference 14 u). Physical properties change gradually; chemical properties stay similar.","Naming: find the number of carbons (meth-, eth-, prop-, but-…), then add the suffix/prefix: chloropropane, propanol, propanal, propanone, propanoic acid, propene, propyne."]],
  ["§4.3 Chemical properties",["Combustion: carbon compounds burn to give CO₂, heat and light. Saturated hydrocarbons give a clean blue flame; unsaturated ones give a sooty yellow flame. A blackened vessel bottom means the fuel isn't burning completely.","Oxidation: alkaline KMnO₄ or acidified K₂Cr₂O₇ (oxidising agents) convert alcohols to carboxylic acids — ethanol → ethanoic acid.","Addition: unsaturated hydrocarbons add hydrogen in the presence of nickel or palladium catalyst. Used to hydrogenate vegetable oils. Animal fats (saturated) are said to be harmful; vegetable oils (unsaturated) are healthier.","Substitution: saturated hydrocarbons react with chlorine in sunlight: CH₄ + Cl₂ → CH₃Cl + HCl."]],
  ["§4.4 Ethanol and ethanoic acid",["Ethanol (alcohol) is a liquid at room temperature, soluble in water; it's the active ingredient of alcoholic drinks and is used in medicines (tincture iodine, cough syrups) as a solvent.","2Na + 2CH₃CH₂OH → 2CH₃CH₂ONa + H₂ (sodium ethoxide).","Ethanol heated at 443 K with excess conc. H₂SO₄ → ethene + water (dehydration).","Ethanoic acid (acetic acid): 5–8% solution in water is vinegar. Pure ethanoic acid freezes in cold climates — glacial acetic acid. It is a weak acid.","Esterification: ethanoic acid + ethanol → ester (sweet-smelling) + water, in the presence of an acid. Esters are used in perfumes and flavouring.","Saponification: ester + NaOH → alcohol + sodium salt of the acid; used to make soap.","Ethanoic acid + NaOH → sodium ethanoate (sodium acetate) + water. With carbonates/hydrogencarbonates it gives salt, CO₂ and water."]],
  ["§4.5 Soaps and detergents",["Soaps are sodium or potassium salts of long-chain carboxylic acids.","A soap molecule has an ionic (hydrophilic) end that dissolves in water and a hydrocarbon (hydrophobic) tail that dissolves in oil.","In water, soap molecules form clusters called micelles: tails point inwards trapping oily dirt, ionic ends face water. Micelles stay in solution, so dirt rinses away.","Hard water contains calcium and magnesium salts; soap reacts with them to form an insoluble precipitate called scum.","Detergents are generally sodium salts of sulphonic acids or ammonium salts with chloride or bromide ions; they also have long hydrocarbon chains. Their charged ends don't form insoluble precipitates with Ca and Mg ions, so they work in hard water. Used in shampoos and cleaning clothes."]]
 ],
 cards:[["Catenation","Carbon's ability to bond with other carbon atoms to form long chains, branches and rings."],["Tetravalency","Carbon has valency 4 – forms four bonds."],["Homologous series","Same functional group; successive members differ by CH₂ (14 u)."],["Isomers","Compounds with the same molecular formula but different structures."],["Hydrogenation","Adding hydrogen to unsaturated oils using a nickel catalyst."],["Esterification","Carboxylic acid + alcohol → ester + water (acid catalyst)."],["Micelle","Cluster of soap molecules – tails trap oil inside, ionic ends face water."],["Glacial acetic acid","Pure ethanoic acid, which freezes in cold climates."]],

  ["Butanone is a four-carbon compound with the functional group:",["Carboxylic acid","Aldehyde","Ketone","Alcohol"],2,"The suffix '-one' indicates a ketone.","NCERT Ex. 2"],
  ["While cooking, the bottom of the vessel gets blackened on the outside. This means:",["The food is not cooked completely","The fuel is not burning completely","The fuel is wet","The fuel is burning completely"],1,"Incomplete combustion gives a sooty flame.","NCERT Ex. 3"],

{
 id:5, unit:"Biology", title:"Life Processes", icon:"🫁",
 notes:[
  ["§5.1 What are life processes?",["Processes that together maintain life: nutrition, respiration, transportation and excretion.","Molecular movement inside living things is a sign of life; viruses show no such movement until they infect a cell."]],
  ["§5.2 Nutrition",["Autotrophic nutrition: organisms make food from CO₂ and water using sunlight and chlorophyll (photosynthesis). 6CO₂ + 12H₂O → C₆H₁₂O₆ + 6O₂ + 6H₂O. Carbohydrate is stored as starch.","Events of photosynthesis: (i) light energy absorbed by chlorophyll, (ii) light energy converted to chemical energy and water split into hydrogen and oxygen, (iii) CO₂ reduced to carbohydrates.","Desert plants take in CO₂ at night and store it as an intermediate, which is used in the day.","Stomata are pores on leaves for gas exchange. Guard cells open them (when water flows in and they swell) and close them (when they shrink).","Heterotrophic nutrition: taking in food made by others. Some break down food outside the body and absorb it (fungi such as bread moulds, yeast, mushrooms); some take in whole food; parasites like Cuscuta (amar-bel), ticks, lice, leeches and tapeworms take nutrition from hosts.","Amoeba takes in food using temporary finger-like extensions which form a food vacuole; Paramoecium uses cilia to move food to a specific spot."]],
  ["§5.2.4 Nutrition in human beings",["Mouth: teeth grind food; salivary amylase in saliva breaks starch into simple sugar.","Peristalsis — rhythmic muscle contractions push food along the alimentary canal.","Stomach: gastric glands release HCl (acidic medium for pepsin), pepsin (protein-digesting enzyme) and mucus (protects the lining from acid).","Small intestine (longest part): bile from the liver makes food alkaline and breaks fats into small globules (emulsification). Pancreatic juice has trypsin (proteins) and lipase (emulsified fats). Intestinal glands complete digestion: proteins → amino acids, carbohydrates → glucose, fats → fatty acids + glycerol.","Villi — finger-like projections — increase the surface area for absorption and have many blood vessels.","Large intestine absorbs water; the rest leaves through the anus, controlled by the anal sphincter.","Herbivores eating grass have a longer small intestine to digest cellulose; carnivores have a shorter one."]],
  ["§5.3 Respiration",["Glucose (6 carbons) → pyruvate (3 carbons) in the cytoplasm.","Anaerobic, in yeast: pyruvate → ethanol + CO₂ + energy (fermentation).","Aerobic, in mitochondria: pyruvate → CO₂ + H₂O + energy. Releases much more energy.","Lack of oxygen in muscles (e.g. during exercise): pyruvate → lactic acid + energy — causes cramps.","Energy is stored as ATP, the 'energy currency' of the cell.","Aquatic organisms breathe faster because dissolved oxygen in water is low.","Human respiratory path: nostrils (fine hairs and mucus filter air) → throat → trachea (rings of cartilage stop it collapsing) → bronchi → bronchioles → alveoli (balloon-like sacs with blood vessels where gases are exchanged).","Haemoglobin, the respiratory pigment in red blood cells, carries oxygen. CO₂ is more soluble in water and is carried mostly in dissolved form."]],
  ["§5.4 Transportation",["Blood = plasma (carries food, CO₂, nitrogenous waste) + RBCs + WBCs + platelets.","Heart has four chambers. Oxygen-rich blood from the lungs → left atrium → left ventricle → body. Deoxygenated blood from the body → right atrium → right ventricle → lungs. Valves stop backflow.","Double circulation: blood passes through the heart twice in each cycle; keeps oxygenated and deoxygenated blood separate — needed by birds and mammals with high energy needs to maintain body temperature.","Amphibians and many reptiles have three-chambered hearts; fishes have two chambers.","Arteries carry blood away from the heart (thick elastic walls). Veins bring blood back (thin walls, valves). Capillaries (one-cell-thick walls) connect them.","Normal blood pressure: systolic about 120 mm Hg, diastolic about 80 mm Hg. High BP is hypertension.","Platelets plug leaks by clotting blood. Lymph (tissue fluid) carries digested fat from the intestine and drains excess fluid back into blood.","Plants: xylem moves water and minerals from roots (pulled up mainly by transpiration — loss of water vapour from leaves); phloem moves food (translocation) using energy from ATP, in both directions."]],
  ["§5.5 Excretion",["Human excretory system: two kidneys, two ureters, urinary bladder, urethra.","Nephrons are the filtration units of the kidney. Bowman's capsule (cup-shaped end of a coiled tube) collects the filtrate from a cluster of thin-walled capillaries.","Glucose, amino acids, salts and much water are selectively reabsorbed. Urine goes through the ureter to the bladder.","Kidney failure is treated with an artificial kidney (hemodialysis), which removes nitrogenous waste from the blood.","Plants get rid of wastes by: oxygen through stomata, storing waste in vacuoles, dropping leaves, storing gums and resins in old xylem, and excreting some into the soil."]]
 ],

{
 id:6, unit:"Biology", title:"Control and Coordination", icon:"🧠",
 notes:[
  ["§6.1 Animals – nervous system",["Receptors in sense organs detect information: taste receptors (gustatory) on the tongue, smell receptors (olfactory) in the nose.","Neuron: information is picked up at the dendrite tip, travels as an electrical impulse through the cell body and along the axon to its end, where chemicals are released. These cross the gap — the synapse — to start an impulse in the next neuron.","Reflex action: a sudden, automatic response (e.g. pulling your hand back from a flame). The pathway is the reflex arc; reflex arcs are formed in the spinal cord.","Central nervous system = brain + spinal cord. Peripheral nervous system = cranial nerves (from the brain) + spinal nerves (from the spinal cord)."]],
  ["§6.1.2 Human brain",["Fore-brain: main thinking part. Has areas for hearing, smell, sight, association areas, and motor areas for voluntary muscles. The hunger centre is also in the fore-brain.","Mid-brain and hind-brain control involuntary actions.","Medulla (hind-brain): blood pressure, salivation, vomiting.","Cerebellum (hind-brain): precision of voluntary actions, posture and balance — walking in a straight line, riding a bicycle, picking up a pencil."]],
  ["§6.1.3–6.1.4 Protection and action",["The brain sits in a bony box (skull) in a fluid-filled balloon that absorbs shocks. The vertebral column protects the spinal cord.","Muscle cells move by changing the shape and arrangement of special proteins in response to nerve impulses."]],
  ["§6.2 Coordination in plants",["Immediate response: the sensitive plant (touch-me-not) folds its leaves when touched. Cells change shape by changing their water content — no growth involved.","Movement due to growth (tropisms): phototropism (light — shoots bend towards it), geotropism (gravity — roots grow downwards), hydrotropism (water), chemotropism (chemicals, e.g. pollen tube growing to the ovule).","Tendrils of pea plants coil around supports because cells away from the contact grow faster.","Plant hormones: auxin (made at the shoot tip; diffuses to the shady side so cells there grow longer — shoot bends towards light), gibberellins (stem growth), cytokinins (cell division; plentiful in fruits and seeds), abscisic acid (inhibits growth; causes wilting of leaves)."]],
  ["§6.3 Hormones in animals",["Adrenaline (adrenal glands): released into blood in emergencies; speeds heartbeat, diverts blood to skeletal muscles, increases breathing rate.","Thyroxin (thyroid): needs iodine; regulates carbohydrate, protein and fat metabolism. Iodine deficiency causes goitre (swollen neck). Iodised salt is recommended.","Growth hormone (pituitary): deficiency in childhood causes dwarfism.","Testosterone (testes) in males and oestrogen (ovaries) in females bring about changes at puberty.","Insulin (pancreas): regulates blood sugar. Too little causes diabetes.","Feedback mechanism controls the timing and amount of hormone released, e.g. rising blood sugar is detected by pancreas cells, which then release more insulin."]]
 ],
 cards:[["Synapse","The gap between two neurons; signals cross it as chemicals."],["Reflex arc","Pathway of a reflex action; formed in the spinal cord."],["Cerebellum","Precision of voluntary actions, posture and balance."],["Medulla","Controls blood pressure, salivation and vomiting."],["Auxin","Makes shoot cells on the shady side grow longer → bending towards light."],["Abscisic acid","Inhibits growth; causes wilting of leaves."],["Goitre","Swollen neck due to iodine deficiency (thyroxin not made)."],["Feedback mechanism","Controls the amount and timing of hormone release, e.g. insulin and blood sugar."]],
 mcq:[
  ["Which of the following is a plant hormone?",["Insulin","Thyroxin","Oestrogen","Cytokinin"],3,"The others are animal hormones.","NCERT Ex. 1"],
  ["The gap between two neurons is called a:",["Dendrite","Synapse","Axon","Impulse"],1,"Chemicals carry the signal across the synapse.","NCERT Ex. 2"],
  ["The brain is responsible for:",["Thinking","Regulating the heart beat","Balancing the body","All of the above"],3,"Fore-brain thinks, hind-brain controls involuntary actions and balance.","NCERT Ex. 3"],
  ["Which part of the brain maintains posture and balance?",["Cerebellum","Medulla","Fore-brain","Mid-brain"],0,"The cerebellum is part of the hind-brain.","Book §6.1.2"],
  ["Blood pressure, salivation and vomiting are controlled by the:",["Medulla","Cerebellum","Fore-brain","Spinal cord"],0,"These involuntary actions are controlled by the medulla in the hind-brain.","Book §6.1.2"],
  ["The plant hormone that inhibits growth is:",["Abscisic acid","Auxin","Gibberellin","Cytokinin"],0,"It also causes wilting of leaves.","Book §6.2.2"],
  ["Growth of a pollen tube towards the ovule is an example of:",["Chemotropism","Phototropism","Geotropism","Hydrotropism"],0,"It grows in response to chemicals.","Book §6.2.2"],
  ["Iodine is necessary for the synthesis of:",["Thyroxin","Insulin","Adrenaline","Growth hormone"],0,"Deficiency of iodine can cause goitre.","Book §6.3"],

{
 id:7, unit:"Biology", title:"How do Organisms Reproduce?", icon:"🌱",
 notes:[
  ["§7.1 Do organisms create exact copies?",["Reproduction involves making copies of DNA (in chromosomes in the nucleus) along with other cell apparatus.","DNA copying is never perfectly accurate, so small variations arise. Variations help a species survive when the environment changes (e.g. a bacterium resistant to heat survives a heat wave)."]],
  ["§7.2 Asexual reproduction",["Fission: Amoeba (binary fission, any plane); Leishmania (binary fission in a definite plane, has a whip-like structure at one end); Plasmodium (multiple fission — many daughter cells at once).","Fragmentation: Spirogyra breaks into pieces that grow into new individuals.","Regeneration: Hydra and Planaria regrow whole organisms from cut pieces using specialised cells.","Budding: Hydra forms a bud from regenerative cells that grows into a tiny individual and detaches.","Vegetative propagation: roots, stems or leaves form new plants — sugarcane, roses, grapes (layering/grafting); Bryophyllum buds on leaf margins. Seedless plants (banana, orange, rose, jasmine) are grown this way. Plants are identical to the parent and bear flowers/fruit sooner.","Tissue culture: new plants grown from a few cells of the growing tip in an artificial medium — used for ornamental plants.","Spore formation: Rhizopus (bread mould) makes spores in sporangia; spores have thick walls and germinate on moist surfaces."]],
  ["§7.3.2 Sexual reproduction in flowering plants",["Stamen (male part) makes pollen grains in the anther. Pistil (female part) = stigma, style, ovary; the ovary contains ovules, each with an egg cell.","Unisexual flowers (papaya, watermelon) have either stamens or pistil; bisexual flowers (Hibiscus, mustard) have both.","Pollination: transfer of pollen from anther to stigma — self-pollination (same flower) or cross-pollination (another flower, by wind, water or animals).","A pollen tube grows from the pollen grain through the style to the ovule. Male germ cell fuses with the female germ cell — fertilisation — forming a zygote.","After fertilisation: zygote → embryo; ovule → seed (seed coat develops); ovary → fruit. Petals, sepals, stamens, style and stigma shrivel and fall off.","Seed contains the future plant (embryo), which germinates under suitable conditions."]],
  ["§7.3.3 Reproduction in human beings",["Puberty: changes such as hair in armpits and genital area, oily skin and pimples; breast enlargement and menstruation in girls; facial hair and voice cracking in boys.","Male: testes (in the scrotum, at a lower temperature) make sperms and testosterone. Sperms travel through the vas deferens, which joins the urethra. Seminal vesicles and prostate gland add fluid.","Female: two ovaries; from puberty, one egg is released each month. The egg travels down the oviduct (fallopian tube) to the uterus.","Fertilisation happens in the oviduct. The embryo implants in the uterus lining. The placenta (disc embedded in the uterine wall with villi) supplies glucose and oxygen and removes waste.","Development inside the mother takes about nine months. If the egg isn't fertilised, the thick uterine lining breaks down and is shed as menstruation (every month, lasting about 2–8 days)."]],
  ["§7.3.3 Reproductive health",["Sexually transmitted diseases: bacterial — gonorrhoea, syphilis; viral — warts, HIV-AIDS. A condom covering the penis helps prevent many of them.","Contraception: mechanical barriers (condoms); hormonal pills (change hormonal balance, may cause side effects); IUCDs such as the loop or copper-T placed in the uterus; surgical methods — blocking the vas deferens in males or the fallopian tube in females.","Female foeticide (removing female foetuses) is reducing the child sex ratio. Prenatal sex determination is prohibited by law."]]
 ],
 cards:[["Binary fission","One cell divides into two – Amoeba, Leishmania."],["Multiple fission","One cell divides into many at once – Plasmodium."],["Regeneration","Whole organism regrows from body pieces – Hydra, Planaria."],["Pollination","Transfer of pollen grains from anther to stigma."],["After fertilisation","Ovule → seed; ovary → fruit."],["Placenta","Supplies glucose and oxygen to the embryo; removes waste."],["Site of fertilisation in humans","Oviduct (fallopian tube)"],["Tissue culture","Growing new plants from a few cells of the growing tip in an artificial medium."]],
 mcq:[
  ["Asexual reproduction takes place through budding in:",["Amoeba","Yeast","Plasmodium","Leishmania"],1,"Yeast forms buds; the others reproduce by fission.","NCERT Ex. 1"],
  ["Which of the following is not a part of the female reproductive system in human beings?",["Ovary","Uterus","Vas deferens","Fallopian tube"],2,"The vas deferens carries sperms in males.","NCERT Ex. 2"],
  ["The anther contains:",["Sepals","Ovules","Pistil","Pollen grains"],3,"Pollen grains carry the male germ cells.","NCERT Ex. 3"],
  ["Multiple fission is seen in:",["Plasmodium","Amoeba","Hydra","Spirogyra"],0,"The malaria parasite divides into many daughter cells at once.","Book §7.2.1"],
  ["Spirogyra reproduces asexually by:",["Fragmentation","Budding","Spore formation","Regeneration"],0,"The filament breaks into pieces that grow.","Book §7.2.2"],
  ["Bryophyllum can be propagated by:",["Buds in the notches of its leaves","Seeds only","Spores","Fragmentation"],0,"Buds on the leaf margins grow into new plants.","Book §7.2.5"],
  ["Rhizopus (bread mould) reproduces by:",["Spore formation","Binary fission","Budding","Regeneration"],0,"Spores form in round sporangia.","Book §7.2.6"],
  ["In human females, fertilisation takes place in the:",["Oviduct (fallopian tube)","Uterus","Ovary","Vagina"],0,"The zygote then implants in the uterus.","Book §7.3.3"],
  ["After fertilisation, the ovary of a flower develops into the:",["Fruit","Seed","Embryo","Pollen tube"],0,"The ovules develop into seeds.","Book §7.3.2"],

{
 id:8, unit:"Biology", title:"Heredity", icon:"🧬",
 notes:[
  ["§8.1–8.2 Variation and inherited traits",["Variations accumulate during reproduction; sexual reproduction produces more diversity than asexual.","Some variations give a better chance of survival in a given environment.","Inherited traits: children share basic features with parents but are not identical, e.g. free or attached earlobes."]],
  ["§8.2.2 Mendel's contributions",["Gregor Johann Mendel (1822–1884) experimented with garden peas and was the first to keep count of individuals with each trait.","Contrasting traits used: round/wrinkled seeds, tall/short plants, white/violet flowers.","Tall × short: all F1 plants were tall — no medium-height plants.","F1 tall plants self-pollinated: in F2, one quarter were short (tall : short = 3 : 1). The F2 had TT, Tt and tt in the ratio 1 : 2 : 1.","Two copies of a factor (gene) control each trait. A single copy of T makes the plant tall (dominant); both copies must be t for it to be short (recessive).","Two traits together: tall/round × short/wrinkled gave all tall and round in F1. In F2, new combinations appeared (tall-wrinkled, short-round), in the ratio 9 : 3 : 3 : 1 — traits are inherited independently."]],
  ["§8.2.3 How traits are expressed",["Cellular DNA is the information source for making proteins. A section of DNA that provides information for one protein is a gene.","Example: plant height depends on a growth hormone. If the gene for the enzyme that makes it works efficiently, the plant is tall; if altered, less hormone is made and the plant is short.","Both parents contribute equally: each germ cell has only one gene set, and the two combine at fertilisation. Genes exist as separate independent pieces called chromosomes; each cell has two copies of each chromosome, one from each parent."]],
  ["§8.2.4 Sex determination",["In some reptiles, the temperature at which fertilised eggs are kept decides the sex. Snails can change sex.","In humans, sex is largely genetically determined. We have 22 pairs of matched chromosomes plus one pair of sex chromosomes.","Women: XX. Men: XY (Y is shorter).","All children get an X from their mother. A child who gets X from the father is a girl; Y from the father is a boy. So half the children will be boys and half girls."]]
 ],
 cards:[["Gene","A section of DNA that provides information for one protein."],["Dominant trait","Expressed even when only one copy is present (e.g. T – tall)."],["Recessive trait","Expressed only when both copies are the same (tt – short)."],["Monohybrid F2 ratio","Tall : short = 3 : 1; TT : Tt : tt = 1 : 2 : 1"],["Dihybrid F2 ratio","9 : 3 : 3 : 1"],["Sex chromosomes","Women XX, men XY. The father's chromosome decides the child's sex."]],
 mcq:[
  ["Tall pea plants with violet flowers × short plants with white flowers gave all violet-flowered progeny, but almost half were short. The tall parent's genetic make-up is:",["TTWW","TTww","TtWW","TtWw"],2,"Half short means the tall parent was Tt; all violet means it was WW.","NCERT Ex. 1"],
  ["In Mendel's cross of tall and short pea plants, the F1 generation was:",["All tall","All short","Half tall, half short","Medium height"],0,"Only the dominant trait (tall) was seen.","Book §8.2.2"],
  ["In the F2 generation of a tall × short cross, the fraction of short plants is:",["One quarter","Half","Three quarters","None"],0,"Tall : short = 3 : 1.","Book §8.2.2"],
  ["The ratio of TT : Tt : tt in the F2 generation is:",["1 : 2 : 1","3 : 1","9 : 3 : 3 : 1","1 : 1"],0,"TT and Tt are tall; tt is short.","Book §8.2.2"],
  ["A dihybrid cross (round-yellow × wrinkled-green) gives an F2 ratio of:",["9 : 3 : 3 : 1","3 : 1","1 : 2 : 1","1 : 1 : 1 : 1"],0,"Traits are inherited independently.","Book §8.2.2"],
  ["A section of DNA that provides information for one protein is called a:",["Gene","Chromosome","Trait","Enzyme"],0,"Genes control traits through proteins.","Book §8.2.3"],
  ["The sex of a child in human beings is determined by:",["The chromosome inherited from the father","The chromosome inherited from the mother","The temperature in the womb","The mother's diet"],0,"The mother always gives X; the father gives X or Y.","Book §8.2.4"],
  ["In which animals can individuals change sex?",["Snails","Humans","Pea plants","Some reptiles only by temperature"],0,"This shows sex is not genetically determined in snails.","Book §8.2.4"],
  ["How many pairs of matched (non-sex) chromosomes do humans have?",["22","23","21","46"],0,"Plus one pair of sex chromosomes.","Book §8.2.4"]
 ]

{
 id:9, unit:"Physics", title:"Light – Reflection and Refraction", icon:"🔦",
 notes:[
  ["§9.1 Reflection",["Laws: (i) angle of incidence = angle of reflection; (ii) incident ray, normal and reflected ray lie in the same plane.","Plane mirror image: virtual, erect, same size, as far behind the mirror as the object is in front, laterally inverted."]],
  ["§9.2 Spherical mirrors",["Concave: reflecting surface curved inwards. Convex: curved outwards.","Pole (P), centre of curvature (C), radius of curvature (R), principal axis, principal focus (F), focal length (f). R = 2f.","Concave mirror images: object at infinity → at F (highly diminished, real, inverted); beyond C → between F and C (diminished, real, inverted); at C → at C (same size, real, inverted); between C and F → beyond C (enlarged, real, inverted); at F → at infinity (highly enlarged); between P and F → behind mirror (enlarged, virtual, erect).","Convex mirror: always virtual, erect, diminished image behind the mirror.","Uses of concave mirrors: torches, search-lights, vehicle headlights (parallel beams), shaving mirrors, dentists' mirrors, solar furnaces.","Convex mirrors are used as rear-view mirrors: they give an erect image and a much wider field of view."]],
  ["§9.2.3–9.2.4 Sign convention, mirror formula",["New Cartesian sign convention: pole is the origin; object is placed to the left; distances in the direction of incident light are positive, opposite are negative; heights above the axis positive, below negative.","Mirror formula: 1/v + 1/u = 1/f.","Magnification m = h′/h = −v/u. Negative m → real image; positive m → virtual image."]],
  ["§9.3 Refraction",["Light changes direction when it goes from one medium to another because its speed changes.","Rarer → denser: bends towards the normal. Denser → rarer: bends away from the normal.","Rectangular glass slab: the emergent ray is parallel to the incident ray but shifted sideways (lateral displacement).","Laws of refraction: (i) incident ray, refracted ray and normal lie in the same plane; (ii) sin i / sin r = constant (Snell's law). This constant is the refractive index of the second medium with respect to the first.","Absolute refractive index n = c/v, where c = 3 × 10⁸ m/s. Water 1.33, crown glass 1.52, diamond 2.42 (highest in the book's table).","Optically denser does not mean higher mass density — e.g. kerosene is optically denser than water but lighter."]],
  ["§9.3.3–9.3.8 Lenses",["Convex lens: thicker in the middle, converging. Concave lens: thicker at the edges, diverging. A lens has two foci; optical centre O.","Convex lens images: object at infinity → at F₂ (highly diminished); beyond 2F₁ → between F₂ and 2F₂ (diminished); at 2F₁ → at 2F₂ (same size); between F₁ and 2F₁ → beyond 2F₂ (enlarged); at F₁ → at infinity; between F₁ and O → same side (enlarged, virtual, erect).","Concave lens: always virtual, erect, diminished image.","Lens formula: 1/v − 1/u = 1/f. Magnification m = h′/h = v/u.","Power P = 1/f (f in metres). SI unit: dioptre (D); 1 D = power of a lens of focal length 1 m. Convex lens: positive power; concave lens: negative power.","Lenses in contact: P = P₁ + P₂ + P₃ + …"]]
 ],
 cards:[["Mirror formula","1/v + 1/u = 1/f"],["Lens formula","1/v − 1/u = 1/f"],["R and f","R = 2f"],["Magnification (mirror)","m = h′/h = −v/u"],["Power of a lens","P = 1/f (metres); unit dioptre (D)"],["Refractive index","n = c/v"],["Why convex rear-view mirrors?","Erect image and a much wider field of view."],["Plane mirror magnification +1 means","Image is the same size, virtual and erect."]],
 mcq:[
  ["Which one of the following materials cannot be used to make a lens?",["Water","Glass","Plastic","Clay"],3,"Clay is not transparent.","NCERT Ex. 1"],
  ["A concave mirror forms a virtual, erect and enlarged image. The object is:",["Between F and C","At C","Beyond C","Between the pole and F"],3,"Only this position gives a virtual image in a concave mirror.","NCERT Ex. 2"],
  ["Where should an object be placed in front of a convex lens to get a real image of the same size?",["At the principal focus","At twice the focal length","At infinity","Between O and F"],1,"Object at 2F₁ gives image at 2F₂, same size.","NCERT Ex. 3"],
  ["A spherical mirror and a thin lens each have a focal length of −15 cm. They are likely to be:",["Both concave","Both convex","Mirror concave, lens convex","Mirror convex, lens concave"],0,"Negative f means concave for both (by sign convention).","NCERT Ex. 4"],
  ["No matter how far you stand from a mirror, your image appears erect. The mirror is likely to be:",["Only plane","Only concave","Only convex","Either plane or convex"],3,"Both always give erect images.","NCERT Ex. 5"],
  ["Which lens would you prefer for reading small letters in a dictionary?",["Convex, f = 50 cm","Concave, f = 50 cm","Convex, f = 5 cm","Concave, f = 5 cm"],2,"A short-focus convex lens magnifies the most.","NCERT Ex. 6"],
  ["An object is 10 cm from a convex mirror of focal length 15 cm. The image is:",["6 cm behind the mirror, virtual and erect","6 cm in front, real","30 cm behind, virtual","At infinity"],0,"1/v = 1/15 − 1/(−10) gives v = +6 cm.","NCERT Ex. 12"],
  ["The focal length of a lens of power −2.0 D is:",["−0.50 m, concave lens","+0.50 m, convex lens","−2 m, concave lens","+2 m, convex lens"],0,"f = 1/P = −0.5 m; negative power means concave.","NCERT Ex. 16"],
  ["A doctor prescribes a lens of power +1.5 D. Its focal length and type are:",["+0.67 m, converging","−0.67 m, diverging","+1.5 m, converging","+0.15 m, converging"],0,"f = 1/1.5 ≈ 0.67 m; positive power = converging.","NCERT Ex. 17"],
  ["Which mirror is used in vehicle headlights?",["Concave","Convex","Plane","Either convex or plane"],0,"It produces a powerful parallel beam.","NCERT Ex. 8"],
  ["Light travels at 2 × 10⁸ m/s in a medium. Its refractive index is:",["1.5","0.67","2.0","1.33"],0,"n = c/v = 3/2 = 1.5.","Book §9.3.2"],
  ["When light goes obliquely from air into glass, it:",["Bends towards the normal","Bends away from the normal","Does not bend","Reflects back completely"],0,"Glass is optically denser than air.","Book §9.3"]
 ]

{
 id:10, unit:"Physics", title:"The Human Eye and the Colourful World", icon:"👁️",
 notes:[
  ["§10.1 The human eye",["Cornea: thin transparent front membrane; most refraction happens at its outer surface.","Iris: dark muscular diaphragm controlling the size of the pupil. Pupil: regulates light entering — larger in dim light, smaller in bright light.","Crystalline (eye) lens: fine-adjusts the focal length to focus on the retina. Ciliary muscles change its curvature.","Retina: light-sensitive screen; the image formed is real and inverted. Light-sensitive cells send electrical signals through the optic nerve to the brain."]],
  ["§10.1.1 Power of accommodation",["The ability of the eye lens to adjust its focal length.","Relaxed ciliary muscles → lens thin, focal length longer → distant objects clear. Contracted ciliary muscles → lens thicker, focal length shorter → near objects clear.","Near point (least distance of distinct vision) of a young adult with normal vision ≈ 25 cm. Far point = infinity.","Cataract: the lens becomes milky and cloudy in old age; vision can be restored by surgery."]],
  ["§10.2 Defects of vision",["Myopia (near-sightedness): far point nearer than infinity; image of distant objects forms in front of the retina. Cause: too much curvature of the eye lens or elongated eyeball. Corrected with a concave lens.","Hypermetropia (far-sightedness): near point farther than 25 cm; image of nearby objects forms behind the retina. Cause: focal length of the lens too long or eyeball too small. Corrected with a convex lens.","Presbyopia: power of accommodation decreases with age (ciliary muscles weaken, lens loses flexibility). Corrected with a convex lens. People with both myopia and hypermetropia need bi-focal lenses — upper part concave (distance), lower part convex (reading).","Refractive defects can also be corrected with contact lenses or surgery."]],
  ["§10.3–10.4 Prism and dispersion",["A prism has two triangular bases and three rectangular faces. The angle between two lateral faces is the angle of the prism.","The angle between the incident ray and the emergent ray is the angle of deviation.","Dispersion: white light splits into seven colours — VIBGYOR (violet, indigo, blue, green, yellow, orange, red). Violet bends the most, red the least.","Isaac Newton showed that a second, inverted prism recombines the colours into white light.","Rainbow: seen in the sky opposite the sun after a shower. Water droplets act like tiny prisms — refraction and dispersion, internal reflection, then refraction again."]],
  ["§10.5 Atmospheric refraction",["Hot air above a fire makes objects behind it appear to waver — the refractive index of air changes.","Twinkling of stars: starlight is refracted continuously by layers of air of changing density; the star's apparent position and brightness keep fluctuating. Stars appear slightly higher than they are near the horizon.","Planets don't twinkle — they are much closer and act as extended sources; fluctuations average out.","Advance sunrise and delayed sunset: the sun is visible about 2 minutes before actual sunrise and about 2 minutes after actual sunset."]],
  ["§10.6 Scattering of light",["Tyndall effect: the path of a beam of light becomes visible due to scattering by colloidal particles — e.g. sunlight through a dense forest canopy.","The colour of scattered light depends on particle size: very fine particles scatter mainly blue (shorter wavelength); larger particles scatter longer wavelengths; very large particles make light appear white.","The clear sky is blue because air molecules scatter blue light much more strongly than red. Without an atmosphere, the sky would look dark — as it does to astronauts at very high altitudes.","Danger signal lights are red because red is least scattered by fog or smoke and can be seen far away."]]
 ],
 cards:[["Power of accommodation","Ability of the eye lens to adjust its focal length."],["Near point of normal eye","About 25 cm"],["Myopia correction","Concave lens"],["Hypermetropia correction","Convex lens"],["Bi-focal lens","Upper concave (distant vision), lower convex (near vision)."],["Dispersion","Splitting of white light into its component colours."],["Why stars twinkle","Atmospheric refraction keeps changing their apparent position and brightness."],["Why the sky is blue","Air molecules scatter blue light more than red."]],
 mcq:[
  ["The human eye can focus on objects at different distances by adjusting the focal length of the eye lens. This is due to:",["Presbyopia","Accommodation","Near-sightedness","Far-sightedness"],1,"The ciliary muscles change the lens's curvature.","NCERT Ex. 1"],
  ["The human eye forms the image of an object at its:",["Cornea","Iris","Pupil","Retina"],3,"The retina is the light-sensitive screen.","NCERT Ex. 2"],
  ["The least distance of distinct vision for a young adult with normal vision is about:",["25 m","2.5 cm","25 cm","2.5 m"],2,"This is the near point of the eye.","NCERT Ex. 3"],

 id:11, unit:"Physics", title:"Electricity", icon:"⚡",
 notes:[
  ["§11.1 Electric current",["Current I = Q/t: rate of flow of charge. SI unit ampere (A); 1 A = 1 C/s. Smaller units: mA, μA.","In metal wires, electrons carry the charge. By convention, current flows opposite to the flow of electrons (from + to −).","Charge of an electron = 1.6 × 10⁻¹⁹ C. One coulomb ≈ 6 × 10¹⁸ electrons.","Ammeter measures current; always connected in series."]],
  ["§11.2–11.3 Potential difference and circuit diagrams",["Potential difference V = W/Q: work done to move unit charge from one point to another. SI unit volt (V); 1 V = 1 J/C.","A cell's chemical action creates the potential difference across its terminals.","Voltmeter measures potential difference; always connected in parallel.","Learn the symbols: cell, battery, plug key/switch (open, closed), wire joint, wires crossing, bulb, resistor, rheostat, ammeter, voltmeter."]],
  ["§11.4–11.5 Ohm's law and resistance",["Ohm's law: V ∝ I at constant temperature, so V = IR. The V–I graph is a straight line through the origin.","Resistance R: property that opposes current. SI unit ohm (Ω). 1 Ω = 1 V/1 A.","A rheostat is a variable resistor used to change the current.","R = ρ l/A. Resistance increases with length and decreases with area of cross-section. ρ (resistivity) depends on the material and temperature, unit Ω m.","Metals and alloys have low resistivity (10⁻⁸ to 10⁻⁶ Ω m); insulators like glass and rubber have very high resistivity. Alloys have higher resistivity than their metals and don't oxidise (burn) easily at high temperature — so they're used in heating devices like irons and toasters. Copper and aluminium are used for transmission lines.","If the diameter of a wire is doubled, its area becomes four times and its resistance becomes ¼."]],
  ["§11.6 Resistors in series and parallel",["Series: Rs = R₁ + R₂ + R₃. Same current flows through each; total potential difference is the sum across each resistor.","Parallel: 1/Rp = 1/R₁ + 1/R₂ + 1/R₃. Same potential difference across each; total current is the sum of the currents. Rp is less than the smallest resistance.","Series isn't used for domestic circuits: if one appliance fails the whole circuit breaks, and all appliances get the same current regardless of their resistance. Parallel gives each appliance the full voltage and lets it be switched independently."]],
  ["§11.7 Heating effect of current",["Joule's law of heating: H = I²Rt. Heat is proportional to the square of the current, the resistance and the time.","Applications: electric iron, toaster, oven, kettle, heater; bulb filament (tungsten, melting point 3380 °C; bulbs are filled with inert nitrogen and argon); electric fuse.","Fuse: a wire of a metal or alloy with a suitable melting point (e.g. aluminium, copper, iron, lead), connected in series. It melts if the current exceeds a safe value. Home fuses are rated 1 A, 2 A, 3 A, 5 A, 10 A, etc."]],
  ["§11.8 Electric power",["Power: rate at which electrical energy is consumed. P = VI = I²R = V²/R. SI unit watt (W): 1 W = 1 V × 1 A.","Energy W = V × I × t.","Commercial unit: kilowatt hour (kWh), the 'unit' on electricity bills. 1 kWh = 3.6 × 10⁶ J.","Electricity isn't 'consumed' — we pay for the energy that moves electrons through appliances."]]
 ],

  ["Which of the following terms does not represent electrical power?",["I²R","IR²","VI","V²/R"],1,"IR² is not a valid expression for power.","NCERT Ex. 2"],
  ["A bulb rated 220 V, 100 W is operated on 110 V. The power consumed is:",["100 W","75 W","50 W","25 W"],3,"Halving V quarters the power (P = V²/R).","NCERT Ex. 3"],
  ["Two identical wires are connected first in series, then in parallel, across the same voltage. Ratio of heat produced (series : parallel) is:",["1 : 2","2 : 1","1 : 4","4 : 1"],2,"Rs = 2R, Rp = R/2; H ∝ 1/R.","NCERT Ex. 4"],
  ["A voltmeter is connected in a circuit:",["In parallel","In series","Either way","Only with a rheostat"],0,"It measures potential difference across two points.","NCERT Ex. 5"],
  ["A 12 V battery drives 2.5 mA through an unknown resistor. Its resistance is:",["4.8 kΩ","30 Ω","4.8 Ω","300 Ω"],0,"R = V/I = 12/0.0025 = 4800 Ω.","NCERT Ex. 8"],
  ["How many 176 Ω resistors in parallel are needed to carry 5 A on a 220 V line?",["4","5","2","8"],0,"Needed R = 220/5 = 44 Ω = 176/4.","NCERT Ex. 10"],
  ["Which uses more energy: a 250 W TV for 1 hour or a 1200 W toaster for 10 minutes?",["The TV (250 Wh vs 200 Wh)","The toaster","Both equal","Can't tell"],0,"Toaster: 1200 × 1/6 h = 200 Wh.","NCERT Ex. 16"],
  ["An electric heater of resistance 44 Ω draws 5 A. The rate at which heat is developed is:",["1100 W","220 W","8.8 W","2200 W"],0,"P = I²R = 25 × 44 = 1100 W.","NCERT Ex. 17"],
  ["The filament of electric lamps is made of:",["Tungsten","Nichrome","Copper","Aluminium"],0,"Tungsten has a very high melting point (3380 °C).","NCERT Ex. 18"],
  ["If the diameter of a wire is doubled (same length and material), its resistance becomes:",["One-fourth","Half","Double","Four times"],0,"Area becomes 4 times; R ∝ 1/A.","NCERT Ex. 6"],
  ["1 kWh is equal to:",["3.6 × 10⁶ J","3.6 × 10³ J","1000 J","3600 J"],0,"1000 W × 3600 s.","Book §11.8"]
